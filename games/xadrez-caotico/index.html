<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xadrez Caótico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1fb; --bg2:#e6ddfa; --panel:#ffffff; --panel2:#f3effb; --text:#1d1830; --muted:#6b6485; --line:#ddd5ee;
  --accent:#7c4dff; --accent-2:#ff8a00; --danger:#e63950; --ok:#14a86b; --gold:#c98a00;
  --shadow:0 8px 24px rgba(40,20,90,.12); --frame:#3a2a1a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120f1f; --bg2:#231a45; --panel:#1f1a35; --panel2:#28214a; --text:#f1ecff; --muted:#a49cc4; --line:#3a3064;
    --accent:#9d7bff; --accent-2:#ffab40; --danger:#ff5872; --ok:#3ddc97; --gold:#ffc940; --shadow:0 8px 30px rgba(0,0,0,.45); --frame:#0b0814;
  }
}
:root[data-theme="dark"]{
  --bg:#120f1f; --bg2:#231a45; --panel:#1f1a35; --panel2:#28214a; --text:#f1ecff; --muted:#a49cc4; --line:#3a3064;
  --accent:#9d7bff; --accent-2:#ffab40; --danger:#ff5872; --ok:#3ddc97; --gold:#ffc940; --shadow:0 8px 30px rgba(0,0,0,.45); --frame:#0b0814;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:radial-gradient(circle at 20% -10%, var(--bg2), transparent 60%),radial-gradient(circle at 100% 100%, var(--bg2), transparent 50%);background-attachment:fixed;color:var(--text);font-family:'Fredoka',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
button{font:inherit}
svg.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;max-width:1240px;margin:0 auto}
h1{margin:0;font-size:1.7rem;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
h1 .logo{width:38px;height:38px}
h1 .x{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 12px;border-radius:12px;cursor:pointer;font-weight:500;box-shadow:var(--shadow);transition:transform .1s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.small{padding:5px 10px;font-size:.9rem;box-shadow:none}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.gems{font-weight:600;padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:inline-flex;gap:6px;align-items:center}
main{display:grid;grid-template-columns:250px auto 250px;gap:18px;justify-content:center;align-items:start;padding:0 16px 28px;max-width:1240px;margin:0 auto}
@media (max-width:1000px){
  main{grid-template-columns:minmax(0,1fr);justify-items:center}
  .panel{width:100%;max-width:560px}
  #panel-b{order:0} .center{order:1} #panel-w{order:2}
}
.center{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.status{min-height:46px;width:100%;max-width:560px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center;font-weight:500;box-shadow:var(--shadow)}
.status.alert{background:var(--danger);color:#fff;border-color:transparent}
.wbar{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.status.alert .wbar{color:var(--text)}
.wbar .cd{color:var(--muted);font-size:.88rem;padding-right:8px}
.board-wrap{position:relative;--bs:min(calc(100vw - 44px),560px);width:var(--bs);height:var(--bs);border-radius:10px;box-shadow:0 0 0 6px var(--frame),0 18px 40px rgba(0,0,0,.35);--sq-l:#f0d9b5;--sq-d:#b58863}
#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;height:100%;border-radius:10px;overflow:hidden}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.sq.l{background:var(--sq-l)} .sq.d{background:var(--sq-d)}
.sq.last::before,.sq.sel::before{content:'';position:absolute;inset:0;z-index:0}
.sq.last::before{background:rgba(255,215,0,.38)}
.sq.sel::before{background:rgba(124,77,255,.5)}
.sq.check{background:radial-gradient(circle,#ff6b6b 0%,#c0182f 85%) !important}
.dot{position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(20,10,40,.35);z-index:3;pointer-events:none}
.ring{position:absolute;inset:4%;border-radius:50%;border:4px solid rgba(230,57,80,.8);z-index:3;pointer-events:none}
.sq.tgt::after{content:'';position:absolute;inset:3px;border-radius:8px;border:3px dashed #ffb300;background:rgba(255,179,0,.18);animation:pulse 1s infinite;z-index:4;pointer-events:none}
.sq.wtgt::after{content:'';position:absolute;inset:3px;border-radius:50%;border:3px solid #ff1744;background:radial-gradient(circle,rgba(255,23,68,.05) 40%,rgba(255,23,68,.35));animation:pulse .8s infinite;z-index:4;pointer-events:none}
.sq.wtgt.area::after{border-radius:6px;border-style:dashed}
.sq.blast::before{content:'';position:absolute;inset:0;background:rgba(255,87,34,.45);z-index:4}
.coord{position:absolute;font-size:10px;font-weight:600;opacity:.65;pointer-events:none;z-index:1;color:rgba(0,0,0,.6)}
.coord.rk{left:3px;top:1px}.coord.fl{right:4px;bottom:1px}
.pu{position:absolute;width:52%;height:52%;animation:float 1.6s ease-in-out infinite;filter:drop-shadow(0 0 5px rgba(255,235,59,.95));z-index:1;pointer-events:none}
.pu svg{width:100%;height:100%}
.meteor{position:absolute;inset:2px;border:3px solid #ff3d00;border-radius:50%;z-index:5;display:flex;align-items:center;justify-content:center;animation:blink .45s infinite alternate;pointer-events:none;background:rgba(255,61,0,.15)}
.meteor svg{width:45%;height:45%}
.pc{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .15s;pointer-events:none}
.pc>svg.sp{width:86%;height:86%;filter:drop-shadow(0 4px 3px rgba(0,0,0,.4));overflow:visible}
.pc.neon>svg.sp{filter:drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 7px var(--glow))}
.pc.pixel>svg.sp{width:80%;height:80%;image-rendering:pixelated}
.sq:hover .pc{transform:scale(1.08)}
.pc.pop{animation:pop .35s ease-out}
.pc.is-frozen>svg.sp{filter:saturate(.25) brightness(1.2) drop-shadow(0 0 4px #9fe8ff)}
.pc.is-frozen::after{content:'';position:absolute;inset:9%;border-radius:12px;background:linear-gradient(135deg,rgba(225,247,255,.55),rgba(140,215,255,.35));border:2px solid rgba(220,245,255,.95);box-shadow:inset 0 0 10px #fff}
.pc.is-shield::before{content:'';position:absolute;inset:3%;border-radius:50%;border:3px solid rgba(80,200,255,.95);box-shadow:0 0 12px rgba(80,200,255,.9),inset 0 0 12px rgba(80,200,255,.6);animation:glow 1.2s ease-in-out infinite alternate}
.badge{position:absolute;width:30%;height:30%;z-index:3;line-height:0}
.badge svg{width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.b-shield{left:1px;top:1px}.b-frozen{right:1px;top:1px}.b-vet{left:1px;bottom:1px}
.wdot{position:absolute;right:5%;bottom:5%;width:13%;height:13%;border-radius:50%;background:#ff9100;border:2px solid #fff3e0;box-shadow:0 0 6px #ff6d00;z-index:3}
#fx{position:absolute;inset:0;pointer-events:none;z-index:20}
.float{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:17px;color:#fff;text-shadow:0 2px 4px #000,0 0 3px #000;white-space:nowrap;animation:floatUp 1.3s forwards}
.part{position:absolute;width:9px;height:9px;border-radius:50%;animation:burst .75s ease-out forwards;box-shadow:0 0 6px currentColor}
.ficon{position:absolute;transform:translate(-50%,-50%);animation:ficon .8s ease-out forwards}
.ficon svg{width:100%;height:100%}
.beam{position:absolute;height:7px;transform-origin:0 50%;border-radius:4px;animation:beam .55s forwards}
.proj{position:absolute;transform:translate(-50%,-50%);transition:left .28s linear,top .28s linear}
.boom{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff7b0 0%,#ffb300 35%,#ff3d00 62%,rgba(255,61,0,0) 72%);animation:boom .55s forwards}
.wave{position:absolute;border-radius:50%;border:5px solid #ffe57f;animation:boom .6s forwards}
.shake{animation:shake .4s}
.under{width:100%;max-width:560px;display:flex;gap:8px;align-items:stretch}
#log{flex:1;max-height:118px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:.88rem;color:var(--muted);box-shadow:var(--shadow)}
#log div{padding:2px 0;border-bottom:1px dashed var(--line)}
#log div:first-child{color:var(--text);font-weight:500}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.panel.active{outline:3px solid var(--accent);outline-offset:2px}
.ph{display:flex;align-items:center;gap:8px;justify-content:space-between}
.pname{font-weight:600;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.chip{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid var(--muted)}
.chip.w{background:#fff}.chip.b{background:#222}
.turnflag{font-size:.75rem;background:var(--accent);color:#fff;border-radius:999px;padding:2px 8px}
.coins{font-weight:600;color:var(--gold);font-size:1.05rem;display:inline-flex;gap:5px;align-items:center}
.inv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 8px}
.slot{aspect-ratio:1;border-radius:12px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;background:var(--panel2);padding:4px;color:var(--text)}
.slot svg{width:80%;height:80%}
button.slot{border-style:solid;border-color:#8b6cff;cursor:pointer;transition:transform .1s}
button.slot:hover:not(:disabled){transform:scale(1.08)}
.slot:disabled{opacity:.6;cursor:default}
.lbl{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:10px}
.lost{min-height:28px;display:flex;flex-wrap:wrap;gap:0;margin-top:4px}
.mini{width:24px;height:26px;display:inline-flex}
.mini .pc>svg.sp{width:100%;height:100%;filter:none}
.arsenal{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.arsenal div{display:flex;align-items:center;gap:5px;font-size:.8rem;color:var(--muted);background:var(--panel2);border-radius:8px;padding:3px 6px}
.arsenal svg{width:18px;height:18px}
.panel .row{display:flex;gap:6px;margin-top:8px}
.panel .row .btn{flex:1;justify-content:center}
.hint{font-size:.8rem;color:var(--muted);margin-top:8px;line-height:1.35}
.modal-bg{position:fixed;inset:0;background:rgba(10,5,25,.62);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--panel);color:var(--text);border-radius:20px;max-width:700px;width:100%;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .25s}
.modal h2{margin:0 0 6px;display:flex;align-items:center;gap:8px}
.modal h3{margin:16px 0 8px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--panel2);display:flex;flex-direction:column;gap:6px}
.card .ic2{width:40px;height:40px}
.card .ic2 svg{width:100%;height:100%}
.card .nm{font-weight:600;display:flex;align-items:center;gap:6px}
.card .ds{font-size:.82rem;color:var(--muted);flex:1}
.card.sel{outline:3px solid var(--accent)}
.prev{display:flex;justify-content:center;height:48px;align-items:center;border-radius:8px;background:linear-gradient(90deg,#e8d3b0,#b58863)}
.prev .pc{width:38px;height:46px}
.bprev{display:grid;grid-template-columns:repeat(4,1fr);height:48px;border-radius:8px;overflow:hidden}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.mode{text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);cursor:pointer;color:var(--text)}
.mode.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel2))}
.mode b{display:block;font-size:1.05rem;margin-bottom:4px}
.mode span{font-size:.85rem;color:var(--muted)}
label.tog{display:flex;gap:8px;align-items:center;margin:6px 0;cursor:pointer}
.rules li{margin:5px 0;line-height:1.4}
.wtable{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.wcard{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--panel2)}
.wcard .pcs{width:44px;height:48px;flex:none;position:relative}
.wcard .pcs .pc{width:44px;height:48px}
.wcard .wi{position:absolute;right:-6px;bottom:-4px;width:24px;height:24px}
.wcard b{display:block}
.wcard span{font-size:.82rem;color:var(--muted)}
.big{width:80px;height:80px;margin:8px auto}
.big svg{width:100%;height:100%}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(-3px)}50%{transform:translateY(3px)}}
@keyframes blink{from{opacity:.35}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes glow{from{opacity:.55}to{opacity:1}}
@keyframes floatUp{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-50px}}
@keyframes burst{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
@keyframes ficon{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
@keyframes beam{0%{opacity:0;filter:brightness(2)}20%{opacity:1}100%{opacity:0}}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.1);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-5px,-2px)}80%{transform:translate(4px,4px)}}
@media (prefers-reduced-motion: reduce){.pu,.meteor,.sq.tgt::after,.sq.wtgt::after,.pc.is-shield::before{animation:none}}
.xh{position:absolute;inset:16%;border-radius:50%;border:3px solid #ff1744;z-index:4;pointer-events:none;animation:pulse .9s infinite;box-shadow:0 0 10px rgba(255,23,68,.7);background:rgba(255,23,68,.12)}
.xh::before,.xh::after{content:'';position:absolute;background:#ff1744}
.xh::before{left:50%;top:-22%;bottom:-22%;width:3px;transform:translateX(-50%)}
.xh::after{top:50%;left:-22%;right:-22%;height:3px;transform:translateY(-50%)}
.wready{position:absolute;right:2%;bottom:2%;width:28%;height:28%;z-index:3;line-height:0}
.wready svg{width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.cdnum{position:absolute;right:3%;bottom:3%;width:28%;height:28%;border-radius:50%;background:#455a64;color:#fff;border:2px solid #fff;z-index:3;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--bs)/8*.19);line-height:1}
.cdnum.lg{position:static;display:inline-flex;width:16px;height:16px;border-width:1.5px}
.cdnum.lg::after{content:'2';font-size:10px}
.legend{width:100%;max-width:560px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:.88rem;color:var(--muted)}
.legend>span{display:inline-flex;align-items:center;gap:6px}
.lg-dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:rgba(20,10,40,.45);vertical-align:-1px;flex:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-dot{background:rgba(255,255,255,.5)}}
:root[data-theme="dark"] .lg-dot{background:rgba(255,255,255,.5)}
.lg-xh{display:inline-block;width:15px;height:15px;border-radius:50%;border:2.5px solid #ff1744;position:relative;vertical-align:-2px;flex:none}
.lg-xh::before{content:'';position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:#ff1744;transform:translateX(-50%)}
.lg-xh::after{content:'';position:absolute;top:50%;left:-4px;right:-4px;height:2px;background:#ff1744;transform:translateY(-50%)}
.howto{display:grid;gap:8px;margin:10px 0;padding:12px;border-radius:14px;background:var(--panel2)}
.howto>div{display:flex;gap:10px;align-items:center}
.diag{display:grid;grid-template-columns:repeat(7,16px);grid-template-rows:repeat(7,16px);width:112px;height:112px;border-radius:6px;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--frame)}
.diag div{position:relative;display:flex;align-items:center;justify-content:center}
.diag .l{background:#f0d9b5}.diag .d{background:#b58863}
.diag .mv::after{content:'';position:absolute;inset:34%;border-radius:50%;background:rgba(20,10,40,.45)}
.diag .at::after{content:'';position:absolute;inset:14%;border-radius:50%;border:2px solid #ff1744;background:rgba(255,23,68,.3)}
.diag .pc{width:16px;height:16px}.diag .pc>svg.sp{width:100%;height:100%;filter:none}
.wcard{align-items:center}
.wtable{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.slot{flex-direction:column;gap:2px;aspect-ratio:auto;min-height:64px}
.slot svg{width:30px;height:30px}
.slot small{font-size:.7rem;color:var(--muted)}
.inv{grid-template-columns:repeat(3,1fr)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<header>
  <h1><span class="logo" id="logo"></span>Xadrez <span class="x">Caótico</span></h1>
  <div class="btns">
    <span class="gems" id="gems" title="Gemas: ganhas ao jogar, usadas para comprar skins"></span>
    <button class="btn primary" id="bNew">Novo jogo</button>
    <button class="btn" id="bSkins"></button>
    <button class="btn" id="bHelp"></button>
    <button class="btn" id="bMute" aria-label="Som"></button>
  </div>
</header>
<main>
  <section class="panel" id="panel-b"></section>
  <section class="center">
    <div class="status" id="status"></div>
    <div class="board-wrap" id="wrap">
      <div id="board"></div>
      <div id="fx"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="under"><div id="log"></div></div>
  </section>
  <section class="panel" id="panel-w"></section>
</main>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
/* =====================================================================
   SPRITES (SVG próprios — nenhum emoji)
   ===================================================================== */
const ICON={
  shield:'<path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5z" fill="#4fc3f7" stroke="#0d47a1" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 5v14c3-1.6 5.2-4.6 5.2-8V7z" fill="#b3e5fc"/>',

function buildDefs(){
  let h='';
  for(const[id,s]of Object.entries(SETS)){if(s.kind!=='vec')continue;
    for(const c of['w','bl']){const p=s[c];h+=`<linearGradient id="gr-${id}-${c==='w'?'w':'b'}" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="${p.t}"/><stop offset="1" stop-color="${p.b}"/></linearGradient>`;}}
  document.getElementById('defs').innerHTML=h;
}
const spriteCache={};
function sprite(type,col,setId){
  const k=setId+type+col;if(spriteCache[k])return spriteCache[k];
  const s=SETS[setId],p=s[col==='w'?'w':'bl'];let svg;
  if(s.kind==='vec'){
    svg=`<svg class="sp" viewBox="0 0 100 100" aria-hidden="true"><g fill="url(#gr-${setId}-${col})" stroke="${p.s}" stroke-width="${s.neon?3:3.6}" stroke-linejoin="round">${SHAPE[type]}${BASE}</g>`+
      `<g fill="none" stroke="${p.a}" stroke-width="2.6" stroke-linecap="round" opacity=".85">${ACCENT[type]}</g><g fill="${p.s}">${ACCENTF[type]}</g></svg>`;
  }else{
    const g=PIX[type],paths={o:'',f:'',h:'',s:''};
    for(let y=0;y<g.length;y++)for(let x=0;x<g[y].length;x++){let ch=g[y][x];if(ch==='.')continue;
      if(ch==='f'){if(g[y][x-1]==='o')ch='h';else if(g[y][x+1]==='o')ch='s';}
      paths[ch]+=`M${x} ${y}h1v1h-1z`;}
    svg=`<svg class="sp" viewBox="-.5 -.5 13 13" shape-rendering="crispEdges" aria-hidden="true">${['o','f','h','s'].map(c=>`<path d="${paths[c]}" fill="${p[c]}"/>`).join('')}</svg>`;
  }
  return spriteCache[k]=svg;
}

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type='sine',v=.12,slide=0,delay=0){
  if(profile.muted)return;const a=ac();if(!a)return;
  try{const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
function noise(d,v=.35,freq=900){
  if(profile.muted)return;const a=ac();if(!a)return;
  try{const n=a.sampleRate*d,buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
    s.buffer=buf;g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start();}catch(e){}
}

/* =====================================================================
   MOVIMENTOS (xadrez normal)
   ===================================================================== */
function pseudoMoves(B,r,c,ep){
  const P=B[r][c];if(!P||frozen(P))return[];
  const col=P.color,out=[];
  const tryAdd=(tr,tc)=>{if(!inB(tr,tc))return false;const T=B[tr][tc];
    if(T){if(T.color!==col&&!shielded(T))out.push({fr:r,fc:c,tr,tc,cap:true});return false;}
    out.push({fr:r,fc:c,tr,tc});return true;};
  const slide=dirs=>{for(const[dr,dc]of dirs){let tr=r+dr,tc=c+dc;while(tryAdd(tr,tc)){tr+=dr;tc+=dc;}}};
  switch(P.type){
    case'r':slide(D4);break;
    case'b':slide(DX);break;
    case'q':slide(D8);break;
    case'n':for(const[dr,dc]of DL)tryAdd(r+dr,c+dc);break;
    case'k':{
      for(const[dr,dc]of D8)tryAdd(r+dr,c+dc);
      const home=col==='w'?7:0;
      if(!P.moved&&r===home&&c===4){
        const rk=B[r][7],rq=B[r][0];
        if(rk&&rk.type==='r'&&rk.color===col&&!rk.moved&&!B[r][5]&&!B[r][6])out.push({fr:r,fc:c,tr:r,tc:6,castle:'k'});
        if(rq&&rq.type==='r'&&rq.color===col&&!rq.moved&&!B[r][1]&&!B[r][2]&&!B[r][3])out.push({fr:r,fc:c,tr:r,tc:2,castle:'q'});
      }break;}
    case'p':{
      const d=col==='w'?-1:1,start=col==='w'?6:1;
      if(inB(r+d,c)&&!B[r+d][c]){out.push({fr:r,fc:c,tr:r+d,tc:c});
        if(r===start&&inB(r+2*d,c)&&!B[r+2*d][c])out.push({fr:r,fc:c,tr:r+2*d,tc:c});}
      for(const dc of[-1,1]){const tr=r+d,tc=c+dc;if(!inB(tr,tc))continue;const T=B[tr][tc];
        if(T){if(T.color!==col&&!shielded(T))out.push({fr:r,fc:c,tr,tc,cap:true});}
        else if(ep&&ep.r===tr&&ep.c===tc){const V=B[r][tc];if(V&&V.type==='p'&&V.color!==col&&!shielded(V))out.push({fr:r,fc:c,tr,tc,cap:true,ep:true});}
      }}
  }
  return out;
}
function allMoves(B,col,ep){const out=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){const P=B[r][c];if(P&&P.color===col)out.push(...pseudoMoves(B,r,c,ep));}return out;}
function findKing(B,col){for(let r=0;r<8;r++)for(let c=0;c<8;c++){const P=B[r][c];if(P&&P.type==='k'&&P.color===col)return[r,c];}return null;}
function kingAttacked(B,col){const k=findKing(B,col);if(!k)return false;return allMoves(B,opp(col),null).some(m=>m.tr===k[0]&&m.tc===k[1]);}

/* =====================================================================
   ARMAS — padrão de mira (em tabuleiro vazio) e alvos reais
   ===================================================================== */
// Casas que a arma cobre, ignorando peças (usado nos diagramas).
function weaponPattern(type,col,r,c){
  const out=[];const add=(tr,tc)=>{if(inB(tr,tc))out.push([tr,tc]);};
  switch(type){
    case'p':add(r+(col==='w'?-1:1),c);break;
    case'n':for(const[dr,dc]of D8)add(r+dr,c+dc);break;
    case'b':for(const[dr,dc]of D4)for(let s=1;s<=3;s++)add(r+dr*s,c+dc*s);break;
    case'r':for(const[dr,dc]of DX)for(let s=1;s<=3;s++)add(r+dr*s,c+dc*s);break;
    case'q':for(const[dr,dc]of DL)add(r+dr,c+dc);break;
    case'k':for(const[dr,dc]of D8)add(r+dr*2,c+dc*2);break;
  }
  return out;
}
const enemyHere=(B,r,c,col)=>{const T=B[r][c];return T&&T.color!==col&&T.type!=='k';};
function weaponTargets(r,c){
  const B=S.board,P=B[r][c];if(!P||!weaponReady(P))return[];
  const col=P.color,out=[];
  const ray=dirs=>{for(const[dr,dc]of dirs)for(let s=1;s<=3;s++){const tr=r+dr*s,tc=c+dc*s;if(!inB(tr,tc))break;if(B[tr][tc]){if(enemyHere(B,tr,tc,col))out.push([tr,tc]);break;}}};
  switch(P.type){
    case'b':ray(D4);break;
    case'r':ray(DX);break;
    case'q':for(const[tr,tc]of weaponPattern('q',col,r,c)){let hits=false;for(const[dr,dc]of D8.concat([[0,0]]))if(inB(tr+dr,tc+dc)&&enemyHere(B,tr+dr,tc+dc,col))hits=true;if(hits)out.push([tr,tc]);}break;
    default:for(const[tr,tc]of weaponPattern(P.type,col,r,c))if(enemyHere(B,tr,tc,col))out.push([tr,tc]);
  }
  return out;
}
function destroy(r,c,silent){
  const P=S.board[r][c];if(!P||P.type==='k')return false;
  if(shielded(P)){P.shield=0;fxText(r,c,'Escudo quebrou!','#80d8ff');SFX.shield();return false;}
  S.board[r][c]=null;S.lost[P.color].push(P.type);
  fxBurst(r,c,'#ff7043',9);fxBurst(r,c,'#ffeb3b',5);
  return true;
}
function useWeapon(r,c,tr,tc){
  const B=S.board,P=B[r][c],col=P.color,W=WEAPONS[P.type],who=COLOR_NAME[col];
  P.cd=S.ply+CD*2;S.pending=null;S.sel=null;S.moves=[];S.wt=[];
  S.last={fr:r,fc:c,tr,tc};
  fxIcon(r,c,W.icon);
  let n=0;
  if(P.type==='q'){
    fxProjectile(r,c,tr,tc,'bomb');SFX.whoosh();const g=S.gid;
    setTimeout(()=>{if(S.gid===g){fxBoom(tr,tc);SFX.boom();shake();}},260);
    for(const[dr,dc]of D8.concat([[0,0]])){const xr=tr+dr,xc=tc+dc;if(!inB(xr,xc))continue;delete S.powerups[key(xr,xc)];if(destroy(xr,xc))n++;}
  }else{
    if(P.type==='b'||P.type==='r'){fxBeam(r,c,tr,tc,P.type==='b'?'linear-gradient(90deg,#8d6e63,#fff59d)':'linear-gradient(90deg,#ff1744,#ffea00)');}
    if(P.type==='b')fxProjectile(r,c,tr,tc,'bow');
    ({p:SFX.stab,n:SFX.thud,b:SFX.whoosh,r:SFX.boom,k:SFX.thud})[P.type]();
    if(P.type==='r'||P.type==='k')shake();
    fxIcon(tr,tc,'boom');
    if(destroy(tr,tc))n++;
  }
  addLog(`${ic(W.icon)} ${who}: ${W.name} do ${NAMES[P.type]} — ${n?`${n} peça(s) destruída(s)!`:'sem baixas.'}`);
  endAction();
}

/* =====================================================================
   AÇÕES
   ===================================================================== */
function doMove(m){
  const B=S.board,P=B[m.fr][m.fc],col=P.color;
  let T=B[m.tr][m.tc],tr=m.tr,tc=m.tc;
  if(m.ep){T=B[m.fr][m.tc];B[m.fr][m.tc]=null;tr=m.fr;tc=m.tc;}
  B[m.tr][m.tc]=P;B[m.fr][m.fc]=null;P.moved=true;
  let txt=`${COLOR_NAME[col]}: ${NAMES[P.type]} ${sqName(m.fr,m.fc)}→${sqName(m.tr,m.tc)}`;
  if(T){S.lost[T.color].push(T.type);txt=`${ic('swords')} ${txt} captura ${NAMES[T.type]}!`;fxBurst(tr,tc,T.type==='k'?'#ffd600':'#fff59d',12);SFX.capture();}
  else SFX.move();
  if(m.castle){const row=m.tr;if(m.castle==='k'){B[row][5]=B[row][7];B[row][7]=null;B[row][5].moved=true;}else{B[row][3]=B[row][0];B[row][0]=null;B[row][3].moved=true;}txt+=' (roque)';}
  S.ep=(P.type==='p'&&Math.abs(m.tr-m.fr)===2)?{r:(m.tr+m.fr)/2,c:m.fc}:null;
  S.last={fr:m.fr,fc:m.fc,tr:m.tr,tc:m.tc};S.anim=key(m.tr,m.tc);
  addLog(txt);
  if(T&&T.type==='k'){gameOver(col,'O Rei foi capturado!');return;}
  if(P.type==='p'&&(m.tr===0||m.tr===7)){P.type='q';SFX.power();setTimeout(()=>fxText(m.tr,m.tc,'Virou Dama!','#ffd54f'),200);addLog(`${ic('crown')} Peão virou Dama!`);}
  pickUp(m.tr,m.tc);
  endAction();
}
function pickUp(r,c){
  const P=S.board[r][c],k=key(r,c);if(!P||!S.powerups[k])return;
  const id=S.powerups[k];delete S.powerups[k];fxIcon(r,c,id);
  if(S.inv[P.color].length>=MAX_ITEMS){fxText(r,c,'Itens cheios!','#fff');return;}
  S.inv[P.color].push(id);fxText(r,c,ITEMS[id].name+'!','#d1c4ff');SFX.power();
  addLog(`${ic(id)} ${COLOR_NAME[P.color]} pegaram: ${ITEMS[id].name}`);
}
function endAction(){
  if(S.over)return;
  if(S.extra){S.extra=false;S.sel=null;S.moves=[];S.wt=[];addLog(`${ic('double')} Jogue de novo!`);render();maybeBot();return;}
  endTurn();
}
function endTurn(){
  S.ply++;S.turn=opp(S.turn);S.sel=null;S.moves=[];S.wt=[];S.pending=null;S.extra=false;
  const hit=S.meteors.filter(m=>m.at<=S.ply);S.meteors=S.meteors.filter(m=>m.at>S.ply);
  if(hit.length){SFX.boom();shake();let n=0;for(const m of hit){fxBoom(m.r,m.c);delete S.powerups[key(m.r,m.c)];if(destroy(m.r,m.c))n++;}addLog(`${ic('meteor')} Meteoros caíram! ${n} peça(s) destruída(s).`);}
  if(S.ply%4===0)spawnPowerup();
  if(S.opts.meteors&&S.ply>=10&&S.ply%10===0)scheduleMeteors();
  if(checkEnd())return;
  if(kingAttacked(S.board,S.turn)){SFX.check();addLog(`${ic('warn')} Xeque nas ${COLOR_NAME[S.turn]}!`);}
  render();maybeBot();
}
const material=col=>{let v=0;for(const row of S.board)for(const P of row)if(P&&P.color===col)v+=VAL[P.type];return v;};
function checkEnd(){
  for(const col of['w','b']){let n=0;for(const row of S.board)for(const P of row)if(P&&P.color===col&&P.type!=='k')n++;
    if(n===0){gameOver(opp(col),`As ${COLOR_NAME[col]} ficaram só com o Rei.`);return true;}}
  if(S.ply>=MAX_ROUNDS*2){const w=material('w'),b=material('b');
    gameOver(w===b?null:(w>b?'w':'b'),`Fim das ${MAX_ROUNDS} rodadas — pontos: Brancas ${w} × ${b} Pretas.`);return true;}
  return false;
}
function spawnPowerup(){
  if(Object.keys(S.powerups).length>=3)return;
  const empty=[];for(let r=2;r<=5;r++)for(let c=0;c<8;c++){const k=key(r,c);if(!S.board[r][c]&&!S.powerups[k])empty.push(k);}
  if(!empty.length)return;
  const tot=SPAWN_POOL.reduce((a,b)=>a+b[1],0);let x=Math.random()*tot,id='shield';
  for(const[i,w]of SPAWN_POOL){if((x-=w)<0){id=i;break;}}
  S.powerups[rnd(empty)]=id;
}
function scheduleMeteors(){
  const all=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){const P=S.board[r][c];if(!P||P.type!=='k')all.push([r,c]);}
  for(let i=0;i<3&&all.length;i++){const j=Math.floor(Math.random()*all.length);const[r,c]=all.splice(j,1)[0];S.meteors.push({r,c,at:S.ply+2});}
  addLog(`${ic('meteor')} Meteoros chegando! Tire suas peças das casas com alvo vermelho.`);SFX.bad();
}
function gameOver(win,why){
  if(S.over)return;
  S.over=true;S.winner=win;S.pending=null;S.sel=null;S.moves=[];S.wt=[];
  SFX.win();setTimeout(()=>addLog(`${ic('trophy')} ${win?COLOR_NAME[win]+' vencem!':'Empate!'} ${why}`),0);
  let gems=0;const mat=c=>S.lost[opp(c)].reduce((a,t)=>a+VAL[t],0);
  if(S.mode==='bot')gems=(win==='w'?25:win?5:10)+mat('w');
  else if(S.mode==='2p')gems=15+Math.floor((mat('w')+mat('b'))/2);
  if(gems){profile.gems+=gems;saveProfile();}
  render();
  const g=S.gid;setTimeout(()=>{if(S.gid===g)showGameOver(win,why,gems);},900);
}

/* =====================================================================
   ITENS
   ===================================================================== */
function itemTargets(p,col){
  const B=S.board,out=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){const P=B[r][c];
    if(p.id==='shield'&&P&&P.color===col&&!shielded(P))out.push([r,c]);
    if(p.id==='freeze'&&P&&P.color!==col&&P.type!=='k'&&!frozen(P))out.push([r,c]);
    if(p.id==='teleport'){if(p.step===0&&P&&P.color===col&&!frozen(P))out.push([r,c]);
      if(p.step===1&&!P){const M=B[p.data.r][p.data.c];if(!(M.type==='p'&&(r===0||r===7)))out.push([r,c]);}}
  }
  return out;
}
function startItem(idx){
  if(!S||S.over||!isHumanTurn())return;
  const id=S.inv[S.turn][idx];if(!id)return;
  S.sel=null;S.moves=[];S.wt=[];
  if(!ITEMS[id].target){applyItem(id,S.turn);return;}
  const p={id,step:0,data:{}};
  if(!itemTargets(p,S.turn).length){toast(`Sem alvos para ${ITEMS[id].name} agora.`);SFX.bad();return;}
  S.pending=p;render();
}
function cancelPending(){if(S&&S.pending){S.pending=null;render();}}
function handlePendingClick(r,c){
  const p=S.pending,col=S.turn;
  if(!itemTargets(p,col).some(([a,b])=>a===r&&b===c)){cancelPending();return;}
  if(p.id==='teleport'&&p.step===0){p.step=1;p.data={r,c};render();return;}
  applyItem(p.id,col,p.data,r,c);
}
function applyItem(id,col,data,r,c){
  const inv=S.inv[col],i=inv.indexOf(id);if(i<0)return;
  inv.splice(i,1);S.pending=null;
  const B=S.board,who=COLOR_NAME[col];
  switch(id){
    case'double':S.extra=true;SFX.power();addLog(`${ic('double')} ${who} usaram Turno Duplo!`);break;
    case'reload':{for(const row of B)for(const P of row)if(P&&P.color===col)P.cd=0;SFX.power();addLog(`${ic('reload')} ${who} recarregaram todas as armas!`);break;}
    case'shield':B[r][c].shield=S.ply+4;fxIcon(r,c,'shield');SFX.shield();addLog(`${ic('shield')} ${who} protegeram ${NAMES[B[r][c].type]}`);break;
    case'freeze':B[r][c].frozen=S.ply+5;fxBurst(r,c,'#b3e5fc',10);fxIcon(r,c,'freeze');SFX.freeze();addLog(`${ic('freeze')} ${who} congelaram ${NAMES[B[r][c].type]}`);break;
    case'teleport':{const P=B[data.r][data.c];B[data.r][data.c]=null;B[r][c]=P;P.moved=true;S.ep=null;fxIcon(data.r,data.c,'teleport');fxIcon(r,c,'teleport');S.anim=key(r,c);S.last={fr:data.r,fc:data.c,tr:r,tc:c};SFX.zap();
      addLog(`${ic('teleport')} ${who} teletransportaram ${NAMES[P.type]} para ${sqName(r,c)}`);pickUp(r,c);break;}
  }
  if(ITEMS[id].ends){endAction();return;}
  render();
}

/* =====================================================================
   BOT
   ===================================================================== */
function maybeBot(){
  if(!S||S.over||!isBot(S.turn))return;
  const g=S.gid,delay=S.mode==='demo'?420:650;
  setTimeout(()=>{if(S.gid===g&&!S.over&&isBot(S.turn))botAct();},delay);
}
function defended(B,r,c,col){const B3=B.map(x=>x.slice());B3[r][c]={type:'p',color:opp(col),shield:0,frozen:0};return allMoves(B3,col,null).some(m=>m.tr===r&&m.tc===c);}
function worstThreat(B2,col){
  let worst=0;
  for(const em of allMoves(B2,opp(col),null)){
    if(!em.cap)continue;const v=B2[em.tr][em.tc];if(!v)continue;
    let val=v.type==='k'?50000:VAL[v.type]*10;
    if(v.type!=='k'&&defended(B2,em.tr,em.tc,col))val=Math.max(0,val-VAL[B2[em.fr][em.fc].type]*10);
    if(val>worst)worst=val;
  }
  return worst;
}
function botAct(){
  const col=S.turn;
  const it=botItem(col);if(it==='turn')return;if(it==='free'){maybeBot();return;}
  const ms=allMoves(S.board,col,S.ep);
  let best=null,bs=-Infinity;for(const m of ms){const s=scoreMove(m,col);if(s>bs){bs=s;best=m;}}
  const w=botWeapon(col);
  if(w){const ws=w.v*10+2-worstThreat(S.board,col)*.9;if(!best||ws>bs){useWeapon(w.r,w.c,w.tr,w.tc);return;}}
  if(!best){addLog(`${COLOR_NAME[col]} não têm jogadas e passam a vez.`);endTurn();return;}
  doMove(best);
}
function scoreMove(m,col){
  const B=S.board,P=B[m.fr][m.fc];
  let s=Math.random()*4;
  const victim=m.ep?B[m.fr][m.tc]:B[m.tr][m.tc];
  if(victim)s+=victim.type==='k'?100000:VAL[victim.type]*10;
  if(S.powerups[key(m.tr,m.tc)])s+=10;
  if(P.type!=='k'&&S.meteors.some(x=>x.r===m.tr&&x.c===m.tc))s-=VAL[P.type]*9;
  if(P.type!=='k'&&S.meteors.some(x=>x.r===m.fr&&x.c===m.fc))s+=VAL[P.type]*8;
  if(P.type==='p'&&(m.tr===0||m.tr===7))s+=80;
  if(m.castle)s+=8;
  s+=(3.5-Math.abs(3.5-m.tc))*.5;
  if(P.type==='p')s+=.6;
  if(P.type==='k'&&!m.castle&&S.ply<30)s-=3;
  const B2=B.map(x=>x.slice());B2[m.tr][m.tc]=P;B2[m.fr][m.fc]=null;if(m.ep)B2[m.fr][m.tc]=null;
  if(m.castle){const row=m.tr;if(m.castle==='k'){B2[row][5]=B2[row][7];B2[row][7]=null;}else{B2[row][3]=B2[row][0];B2[row][0]=null;}}
  return s-worstThreat(B2,col)*.9;
}
function pieceVal(T,col){if(!T||T.type==='k')return 0;if(shielded(T))return T.color!==col?.5:0;return T.color!==col?VAL[T.type]:-VAL[T.type]*1.3;}
function botWeapon(col){
  const B=S.board;let best=null;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const P=B[r][c];if(!P||P.color!==col||!weaponReady(P))continue;
    for(const[tr,tc]of weaponTargets(r,c)){
      let v=0;
      if(P.type==='q'){for(const[dr,dc]of D8.concat([[0,0]]))if(inB(tr+dr,tc+dc))v+=pieceVal(B[tr+dr][tc+dc],col);}
      else v=pieceVal(B[tr][tc],col);
      if(v>=1&&(!best||v>best.v))best={r,c,tr,tc,v};
    }
  }
  return best;
}
function botItem(col){
  const inv=S.inv[col];if(!inv.length)return false;
  const has=id=>inv.includes(id),B=S.board,en=opp(col);
  const threats=allMoves(B,en,S.ep).filter(m=>m.cap);
  const kp=findKing(B,col),kingIn=kingAttacked(B,col);
  if(kingIn&&kp){
    if(has('shield')&&!shielded(B[kp[0]][kp[1]])){applyItem('shield',col,null,kp[0],kp[1]);return'free';}
    if(has('freeze')){const t=threats.find(t=>t.tr===kp[0]&&t.tc===kp[1]);if(t&&B[t.fr][t.fc].type!=='k'){applyItem('freeze',col,null,t.fr,t.fc);return'free';}}
    if(has('teleport')){const sq=itemTargets({id:'teleport',step:1,data:{r:kp[0],c:kp[1]}},col).filter(([r,c])=>{const B2=B.map(x=>x.slice());B2[r][c]=B2[kp[0]][kp[1]];B2[kp[0]][kp[1]]=null;return!kingAttacked(B2,col);});
      if(sq.length){const[r,c]=rnd(sq);applyItem('teleport',col,{r:kp[0],c:kp[1]},r,c);return'turn';}}
  }
  if(has('double')){applyItem('double',col);return'free';}
  if(has('reload')){let n=0;for(const row of B)for(const P of row)if(P&&P.color===col&&!weaponReady(P)&&!frozen(P))n++;if(n>=4){applyItem('reload',col);return'free';}}
  if(has('shield')){const t=threats.map(t=>[t.tr,t.tc]).filter(([r,c])=>B[r][c]&&VAL[B[r][c].type]>=5&&!shielded(B[r][c])&&!defended(B,r,c,col))[0];if(t){applyItem('shield',col,null,t[0],t[1]);return'free';}}
  if(has('freeze')){const t=threats.filter(t=>B[t.tr][t.tc]&&VAL[B[t.tr][t.tc].type]>=3&&B[t.fr][t.fc].type!=='k'&&!frozen(B[t.fr][t.fc]))[0];if(t){applyItem('freeze',col,null,t.fr,t.fc);return'free';}}
  return false;
}

function pieceHTML(P,anim,r,c){

}
function miniHTML(type,color,setId){const st=setId||profile.set,s=SETS[st];const glow=s.neon?` style="--glow:${s[color==='w'?'w':'bl'].s}"`:'';return `<div class="pc ${s.kind==='pix'?'pixel':''} ${s.neon?'neon':''}"${glow}>${sprite(type,color,st)}</div>`;}
let hoverSq=null;
function render(){
  const B=S.board,col=S.turn;
  const itgt=S.pending?new Set(itemTargets(S.pending,col).map(([r,c])=>key(r,c))):new Set();
  const wset=new Set(S.wt.map(([r,c])=>key(r,c)));
  const selQ=S.sel&&B[S.sel.r][S.sel.c]?.type==='q';
  const blast=new Set();
  if(selQ&&hoverSq&&wset.has(key(hoverSq[0],hoverSq[1])))for(const[dr,dc]of D8.concat([[0,0]]))blast.add(key(hoverSq[0]+dr,hoverSq[1]+dc));
  const mmap=new Map(S.moves.map(m=>[key(m.tr,m.tc),m]));
  const kc=!S.over&&kingAttacked(B,col)?findKing(B,col):null;
  let h='';
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const k=key(r,c),P=B[r][c];
    let cls='sq '+((r+c)%2?'d':'l');
    if(S.last&&((S.last.fr===r&&S.last.fc===c)||(S.last.tr===r&&S.last.tc===c)))cls+=' last';
    if(S.sel&&S.sel.r===r&&S.sel.c===c)cls+=' sel';
    if(S.pending&&S.pending.step===1&&S.pending.data.r===r&&S.pending.data.c===c)cls+=' sel';
    if(itgt.has(k))cls+=' tgt';
    if(blast.has(k))cls+=' blast';
    if(kc&&kc[0]===r&&kc[1]===c)cls+=' check';
    let inner='';
    if(c===0)inner+=`<span class="coord rk">${8-r}</span>`;
    if(r===7)inner+=`<span class="coord fl">${'abcdefgh'[c]}</span>`;
    if(S.powerups[k])inner+=`<span class="pu">${ic(S.powerups[k],'')}</span>`;
    if(P)inner+=pieceHTML(P,S.anim===k,r,c);
    const m=mmap.get(k);if(m)inner+=m.cap?'<span class="ring"></span>':'<span class="dot"></span>';
    if(wset.has(k))inner+='<span class="xh"></span>';
    if(S.meteors.some(x=>x.r===r&&x.c===c))inner+=`<span class="meteor">${ic('meteor','')}</span>`;
    h+=`<div class="${cls}" data-r="${r}" data-c="${c}" role="button" aria-label="${sqName(r,c)}">${inner}</div>`;
  }

  const bt=BOARDS[profile.board],w=$('#wrap');w.style.setProperty('--sq-l',bt.l);w.style.setProperty('--sq-d',bt.d);

}

function fxAdd(el,ms){$('#fx').appendChild(el);setTimeout(()=>el.remove(),ms);}
function fxText(r,c,t,color){const[x,y]=center(r,c);const d=document.createElement('div');d.className='float';d.textContent=t;d.style.left=x+'px';d.style.top=y+'px';if(color)d.style.color=color;fxAdd(d,1300);}
function fxBurst(r,c,color,n=8){const[x,y,s]=center(r,c);for(let i=0;i<n;i++){const d=document.createElement('div');d.className='part';d.style.background=color;d.style.color=color;const a=Math.random()*Math.PI*2,dist=s*(.5+Math.random()*.9);d.style.left=x+'px';d.style.top=y+'px';d.style.setProperty('--dx',Math.cos(a)*dist+'px');d.style.setProperty('--dy',Math.sin(a)*dist+'px');fxAdd(d,760);}}

function fxProjectile(r1,c1,r2,c2,name){const[x1,y1,s]=center(r1,c1),[x2,y2]=center(r2,c2);const d=document.createElement('div');d.className='proj';d.innerHTML=ic(name,'');d.style.width=d.style.height=s*.5+'px';d.style.left=x1+'px';d.style.top=y1+'px';

/* ---------- Diagramas das armas ---------- */
function diagram(type){
  const r0=type==='p'?4:3,c0=3,map={};
  // movimento em tabuleiro 7x7 vazio
  const mv=[];const inD=(r,c)=>r>=0&&r<7&&c>=0&&c<7;
  const slide=dirs=>{for(const[dr,dc]of dirs)for(let s=1;s<7;s++){if(inD(r0+dr*s,c0+dc*s))mv.push([r0+dr*s,c0+dc*s]);}};
  if(type==='r')slide(D4);if(type==='b')slide(DX);if(type==='q')slide(D8);
  if(type==='n')for(const[dr,dc]of DL)mv.push([r0+dr,c0+dc]);
  if(type==='k')for(const[dr,dc]of D8)mv.push([r0+dr,c0+dc]);
  if(type==='p'){mv.push([r0-1,c0],[r0-2,c0]);}
  for(const[r,c]of mv)if(inD(r,c))map[r+','+c]='mv';
  for(const[r,c]of weaponPattern(type,'w',r0,c0))if(inD(r,c))map[r+','+c]='at';
  let h='';for(let r=0;r<7;r++)for(let c=0;c<7;c++){const k=r+','+c;h+=`<div class="${(r+c)%2?'d':'l'} ${map[k]||''}">${r===r0&&c===c0?miniHTML(type,'w','classic'):''}</div>`;}
  return `<div class="diag">${h}</div>`;
}

function showGameOver(win,why,gems){
  const title=!win?'Empate!':S.mode==='bot'?(win==='w'?'Você venceu!':'O bot venceu…'):`${COLOR_NAME[win]} venceram!`;
  openModal(`<div class="big">${ic(S.mode==='bot'&&win==='b'?'skull':'trophy','')}</div><h2 style="justify-content:center">${title}</h2><p style="text-align:center" class="hint">${why}</p>
   ${gems?`<p style="text-align:center;font-size:1.2rem">+${gems} ${ic('gem')} gemas para skins</p>`:''}
   <div style="display:flex;gap:8px;justify-content:center;margin-top:12px"><button class="btn" id="goSkins">${ic('palette')} Skins</button><button class="btn primary" id="goNew">Jogar de novo</button></div>`);
}

/* ---------- Eventos ---------- */
function selectPiece(r,c){
  S.sel={r,c};S.moves=pseudoMoves(S.board,r,c,S.ep);S.wt=weaponTargets(r,c);
}
$('#board').addEventListener('click',e=>{
  const sq=e.target.closest('.sq');if(!sq||!S||S.over||!isHumanTurn())return;
  ac();
  const r=+sq.dataset.r,c=+sq.dataset.c;
  if(S.pending){handlePendingClick(r,c);return;}
  if(S.sel){
    const m=S.moves.find(m=>m.tr===r&&m.tc===c);if(m){S.sel=null;S.moves=[];S.wt=[];doMove(m);return;}
    if(S.wt.some(([a,b])=>a===r&&b===c)){useWeapon(S.sel.r,S.sel.c,r,c);return;}
  }
  const P=S.board[r][c];
  if(P&&P.color===S.turn&&!(S.sel&&S.sel.r===r&&S.sel.c===c)){
    selectPiece(r,c);
    if(frozen(P)){SFX.freeze();}
  }else{S.sel=null;S.moves=[];S.wt=[];}
  render();
});
$('#board').addEventListener('mouseover',e=>{
  if(!S||!S.sel||S.board[S.sel.r][S.sel.c]?.type!=='q')return;const sq=e.target.closest('.sq');if(!sq)return;
  const r=+sq.dataset.r,c=+sq.dataset.c;if(hoverSq&&hoverSq[0]===r&&hoverSq[1]===c)return;
  hoverSq=[r,c];render();
});
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.item!==undefined){ac();startItem(+t.dataset.item);}
  else if(t.dataset.skin){useSkin(t.dataset.skin);}
  else if(t.dataset.close){closeModal();}
  else if(t.dataset.mode){nm.mode=t.dataset.mode;nm.meteors=$('#nmMet').checked;showNewGame();}
  else if(t.id==='nmGo'){nm.meteors=$('#nmMet').checked;closeModal();ac();newGame(nm.mode,nm.meteors);}
  else if(t.id==='nmHelp'){showHelp();}
  else if(t.id==='sCancel'){cancelPending();}
  else if(t.id==='sPass'){addLog(`${COLOR_NAME[S.turn]} passaram a vez.`);endTurn();}
  else if(t.id==='sNew'||t.id==='goNew'){showNewGame();}
  else if(t.id==='goSkins'){showSkins();}
});
$('#bNew').onclick=showNewGame;
$('#bSkins').onclick=showSkins;
$('#bHelp').onclick=showHelp;
$('#bMute').onclick=()=>{profile.muted=!profile.muted;saveProfile();$('#bMute').innerHTML=ic(profile.muted?'mute':'sound');};
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg'&&S)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modalBg').classList.contains('open')&&S)closeModal();else{cancelPending();if(S&&S.sel){S.sel=null;S.moves=[];S.wt=[];render();}}}});

buildDefs();
$('#logo').innerHTML=miniHTML('n','w','classic');
$('#bSkins').innerHTML=ic('palette')+' Skins';
$('#bHelp').innerHTML=ic('help')+' Regras';
$('#legend').innerHTML=`<span><span class="lg-dot"></span>mover para cá</span><span><span class="lg-xh"></span>atirar aqui (sua peça fica parada)</span><span>${ic('target')}no canto da peça: ela tem alvo agora</span>`;
newGame('bot',true);
showNewGame();
window.__xc={get S(){return S},newGame,render:()=>render(),useWeapon,weaponTargets,selectPiece};
</script>
</body>
</html>
