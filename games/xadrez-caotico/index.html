<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xadrez Caótico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1fb; --bg2:#e6ddfa; --panel:#ffffff; --panel2:#f3effb; --text:#1d1830; --muted:#6b6485; --line:#ddd5ee;
  --accent:#7c4dff; --accent-2:#ff8a00; --danger:#e63950; --ok:#14a86b; --gold:#c98a00;
  --shadow:0 8px 24px rgba(40,20,90,.12); --frame:#3a2a1a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120f1f; --bg2:#231a45; --panel:#1f1a35; --panel2:#28214a; --text:#f1ecff; --muted:#a49cc4; --line:#3a3064;
    --accent:#9d7bff; --accent-2:#ffab40; --danger:#ff5872; --ok:#3ddc97; --gold:#ffc940; --shadow:0 8px 30px rgba(0,0,0,.45); --frame:#0b0814;
  }
}
:root[data-theme="dark"]{
  --bg:#120f1f; --bg2:#231a45; --panel:#1f1a35; --panel2:#28214a; --text:#f1ecff; --muted:#a49cc4; --line:#3a3064;
  --accent:#9d7bff; --accent-2:#ffab40; --danger:#ff5872; --ok:#3ddc97; --gold:#ffc940; --shadow:0 8px 30px rgba(0,0,0,.45); --frame:#0b0814;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--bg);background-image:radial-gradient(circle at 20% -10%, var(--bg2), transparent 60%),radial-gradient(circle at 100% 100%, var(--bg2), transparent 50%);background-attachment:fixed;color:var(--text);font-family:'Fredoka',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
button{font:inherit}
svg.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;max-width:1240px;margin:0 auto}
h1{margin:0;font-size:1.7rem;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
h1 .logo{width:38px;height:38px}
h1 .x{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 12px;border-radius:12px;cursor:pointer;font-weight:500;box-shadow:var(--shadow);transition:transform .1s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn.small{padding:5px 10px;font-size:.9rem;box-shadow:none}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.gems{font-weight:600;padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:inline-flex;gap:6px;align-items:center}
main{display:grid;grid-template-columns:250px auto 250px;gap:18px;justify-content:center;align-items:start;padding:0 16px 28px;max-width:1240px;margin:0 auto}
@media (max-width:1000px){
  main{grid-template-columns:minmax(0,1fr);justify-items:center}
  .panel{width:100%;max-width:560px}
  #panel-b{order:0} .center{order:1} #panel-w{order:2}
}
.center{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.status{min-height:46px;width:100%;max-width:560px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:center;font-weight:500;box-shadow:var(--shadow)}
.status.alert{background:var(--danger);color:#fff;border-color:transparent}
.wbar{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.status.alert .wbar{color:var(--text)}
.wbar .cd{color:var(--muted);font-size:.88rem;padding-right:8px}
.board-wrap{position:relative;--bs:min(calc(100vw - 44px),560px);width:var(--bs);height:var(--bs);border-radius:10px;box-shadow:0 0 0 6px var(--frame),0 18px 40px rgba(0,0,0,.35);--sq-l:#f0d9b5;--sq-d:#b58863}
#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;height:100%;border-radius:10px;overflow:hidden}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.sq.l{background:var(--sq-l)} .sq.d{background:var(--sq-d)}
.sq.last::before,.sq.sel::before{content:'';position:absolute;inset:0;z-index:0}
.sq.last::before{background:rgba(255,215,0,.38)}
.sq.sel::before{background:rgba(124,77,255,.5)}
.sq.check{background:radial-gradient(circle,#ff6b6b 0%,#c0182f 85%) !important}
.dot{position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(20,10,40,.35);z-index:3;pointer-events:none}
.ring{position:absolute;inset:4%;border-radius:50%;border:4px solid rgba(230,57,80,.8);z-index:3;pointer-events:none}
.sq.tgt::after{content:'';position:absolute;inset:3px;border-radius:8px;border:3px dashed #ffb300;background:rgba(255,179,0,.18);animation:pulse 1s infinite;z-index:4;pointer-events:none}
.sq.wtgt::after{content:'';position:absolute;inset:3px;border-radius:50%;border:3px solid #ff1744;background:radial-gradient(circle,rgba(255,23,68,.05) 40%,rgba(255,23,68,.35));animation:pulse .8s infinite;z-index:4;pointer-events:none}
.sq.wtgt.area::after{border-radius:6px;border-style:dashed}
.sq.blast::before{content:'';position:absolute;inset:0;background:rgba(255,87,34,.45);z-index:4}
.coord{position:absolute;font-size:10px;font-weight:600;opacity:.65;pointer-events:none;z-index:1;color:rgba(0,0,0,.6)}
.coord.rk{left:3px;top:1px}.coord.fl{right:4px;bottom:1px}
.pu{position:absolute;width:52%;height:52%;animation:float 1.6s ease-in-out infinite;filter:drop-shadow(0 0 5px rgba(255,235,59,.95));z-index:1;pointer-events:none}
.pu svg{width:100%;height:100%}
.meteor{position:absolute;inset:2px;border:3px solid #ff3d00;border-radius:50%;z-index:5;display:flex;align-items:center;justify-content:center;animation:blink .45s infinite alternate;pointer-events:none;background:rgba(255,61,0,.15)}
.meteor svg{width:45%;height:45%}
.pc{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .15s;pointer-events:none}
.pc>svg.sp{width:86%;height:86%;filter:drop-shadow(0 4px 3px rgba(0,0,0,.4));overflow:visible}
.pc.neon>svg.sp{filter:drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 7px var(--glow))}
.pc.pixel>svg.sp{width:80%;height:80%;image-rendering:pixelated}
.sq:hover .pc{transform:scale(1.08)}
.pc.pop{animation:pop .35s ease-out}
.pc.is-frozen>svg.sp{filter:saturate(.25) brightness(1.2) drop-shadow(0 0 4px #9fe8ff)}
.pc.is-frozen::after{content:'';position:absolute;inset:9%;border-radius:12px;background:linear-gradient(135deg,rgba(225,247,255,.55),rgba(140,215,255,.35));border:2px solid rgba(220,245,255,.95);box-shadow:inset 0 0 10px #fff}
.pc.is-shield::before{content:'';position:absolute;inset:3%;border-radius:50%;border:3px solid rgba(80,200,255,.95);box-shadow:0 0 12px rgba(80,200,255,.9),inset 0 0 12px rgba(80,200,255,.6);animation:glow 1.2s ease-in-out infinite alternate}
.badge{position:absolute;width:30%;height:30%;z-index:3;line-height:0}
.badge svg{width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.b-shield{left:1px;top:1px}.b-frozen{right:1px;top:1px}.b-vet{left:1px;bottom:1px}
.wdot{position:absolute;right:5%;bottom:5%;width:13%;height:13%;border-radius:50%;background:#ff9100;border:2px solid #fff3e0;box-shadow:0 0 6px #ff6d00;z-index:3}
#fx{position:absolute;inset:0;pointer-events:none;z-index:20}
.float{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:17px;color:#fff;text-shadow:0 2px 4px #000,0 0 3px #000;white-space:nowrap;animation:floatUp 1.3s forwards}
.part{position:absolute;width:9px;height:9px;border-radius:50%;animation:burst .75s ease-out forwards;box-shadow:0 0 6px currentColor}
.ficon{position:absolute;transform:translate(-50%,-50%);animation:ficon .8s ease-out forwards}
.ficon svg{width:100%;height:100%}
.beam{position:absolute;height:7px;transform-origin:0 50%;border-radius:4px;animation:beam .55s forwards}
.proj{position:absolute;transform:translate(-50%,-50%);transition:left .28s linear,top .28s linear}
.boom{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff7b0 0%,#ffb300 35%,#ff3d00 62%,rgba(255,61,0,0) 72%);animation:boom .55s forwards}
.wave{position:absolute;border-radius:50%;border:5px solid #ffe57f;animation:boom .6s forwards}
.shake{animation:shake .4s}
.under{width:100%;max-width:560px;display:flex;gap:8px;align-items:stretch}
#log{flex:1;max-height:118px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:.88rem;color:var(--muted);box-shadow:var(--shadow)}
#log div{padding:2px 0;border-bottom:1px dashed var(--line)}
#log div:first-child{color:var(--text);font-weight:500}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.panel.active{outline:3px solid var(--accent);outline-offset:2px}
.ph{display:flex;align-items:center;gap:8px;justify-content:space-between}
.pname{font-weight:600;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.chip{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid var(--muted)}
.chip.w{background:#fff}.chip.b{background:#222}
.turnflag{font-size:.75rem;background:var(--accent);color:#fff;border-radius:999px;padding:2px 8px}
.coins{font-weight:600;color:var(--gold);font-size:1.05rem;display:inline-flex;gap:5px;align-items:center}
.inv{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 8px}
.slot{aspect-ratio:1;border-radius:12px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;background:var(--panel2);padding:4px;color:var(--text)}
.slot svg{width:80%;height:80%}
button.slot{border-style:solid;border-color:#8b6cff;cursor:pointer;transition:transform .1s}
button.slot:hover:not(:disabled){transform:scale(1.08)}
.slot:disabled{opacity:.6;cursor:default}
.lbl{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:10px}
.lost{min-height:28px;display:flex;flex-wrap:wrap;gap:0;margin-top:4px}
.mini{width:24px;height:26px;display:inline-flex}
.mini .pc>svg.sp{width:100%;height:100%;filter:none}
.arsenal{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.arsenal div{display:flex;align-items:center;gap:5px;font-size:.8rem;color:var(--muted);background:var(--panel2);border-radius:8px;padding:3px 6px}
.arsenal svg{width:18px;height:18px}
.panel .row{display:flex;gap:6px;margin-top:8px}
.panel .row .btn{flex:1;justify-content:center}
.hint{font-size:.8rem;color:var(--muted);margin-top:8px;line-height:1.35}
.modal-bg{position:fixed;inset:0;background:rgba(10,5,25,.62);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.open{display:flex}
.modal{background:var(--panel);color:var(--text);border-radius:20px;max-width:700px;width:100%;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .25s}
.modal h2{margin:0 0 6px;display:flex;align-items:center;gap:8px}
.modal h3{margin:16px 0 8px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--panel2);display:flex;flex-direction:column;gap:6px}
.card .ic2{width:40px;height:40px}
.card .ic2 svg{width:100%;height:100%}
.card .nm{font-weight:600;display:flex;align-items:center;gap:6px}
.card .ds{font-size:.82rem;color:var(--muted);flex:1}
.card.sel{outline:3px solid var(--accent)}
.prev{display:flex;justify-content:center;height:48px;align-items:center;border-radius:8px;background:linear-gradient(90deg,#e8d3b0,#b58863)}
.prev .pc{width:38px;height:46px}
.bprev{display:grid;grid-template-columns:repeat(4,1fr);height:48px;border-radius:8px;overflow:hidden}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.mode{text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);cursor:pointer;color:var(--text)}
.mode.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel2))}
.mode b{display:block;font-size:1.05rem;margin-bottom:4px}
.mode span{font-size:.85rem;color:var(--muted)}
label.tog{display:flex;gap:8px;align-items:center;margin:6px 0;cursor:pointer}
.rules li{margin:5px 0;line-height:1.4}
.wtable{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.wcard{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--panel2)}
.wcard .pcs{width:44px;height:48px;flex:none;position:relative}
.wcard .pcs .pc{width:44px;height:48px}
.wcard .wi{position:absolute;right:-6px;bottom:-4px;width:24px;height:24px}
.wcard b{display:block}
.wcard span{font-size:.82rem;color:var(--muted)}
.big{width:80px;height:80px;margin:8px auto}
.big svg{width:100%;height:100%}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(-3px)}50%{transform:translateY(3px)}}
@keyframes blink{from{opacity:.35}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes glow{from{opacity:.55}to{opacity:1}}
@keyframes floatUp{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-50px}}
@keyframes burst{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
@keyframes ficon{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
@keyframes beam{0%{opacity:0;filter:brightness(2)}20%{opacity:1}100%{opacity:0}}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.1);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-5px,-2px)}80%{transform:translate(4px,4px)}}
@media (prefers-reduced-motion: reduce){.pu,.meteor,.sq.tgt::after,.sq.wtgt::after,.pc.is-shield::before{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<header>
  <h1><span class="logo" id="logo"></span>Xadrez <span class="x">Caótico</span></h1>
  <div class="btns">
    <span class="gems" id="gems" title="Gemas: ganhas ao jogar, usadas para comprar skins"></span>
    <button class="btn primary" id="bNew">Novo jogo</button>
    <button class="btn" id="bSkins"></button>
    <button class="btn" id="bHelp"></button>
    <button class="btn" id="bMute" aria-label="Som"></button>
  </div>
</header>
<main>
  <section class="panel" id="panel-b"></section>
  <section class="center">
    <div class="status" id="status"></div>
    <div class="board-wrap" id="wrap">
      <div id="board"></div>
      <div id="fx"></div>
    </div>
    <div class="under"><div id="log"></div></div>
  </section>
  <section class="panel" id="panel-w"></section>
</main>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
/* =====================================================================
   SPRITES (SVG próprios — nenhum emoji)
   ===================================================================== */
const ICON={
  shield:'<path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5z" fill="#4fc3f7" stroke="#0d47a1" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 5v14c3-1.6 5.2-4.6 5.2-8V7z" fill="#b3e5fc"/>',
  freeze:'<g stroke="#29b6f6" stroke-width="2.2" stroke-linecap="round" fill="none"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7"/><path d="M9 3.5l3 2.5 3-2.5M9 20.5l3-2.5 3 2.5M3 10.5l3.6-1-1-3.5M21 13.5l-3.6 1 1 3.5M3 13.5l3.6 1-1 3.5M21 10.5l-3.6-1 1-3.5"/></g><circle cx="12" cy="12" r="2.2" fill="#e1f5fe" stroke="#0277bd"/>',
  double:'<path d="M13.5 1.5 4 14h6.5L9 22.5 19.5 9.5H13z" fill="#ffd600" stroke="#e65100" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 5 8 11h3" fill="none" stroke="#fff9c4" stroke-width="1.3"/>',
  teleport:'<ellipse cx="12" cy="12" rx="9.5" ry="10.5" fill="#651fff"/><ellipse cx="12" cy="12" rx="6.8" ry="7.6" fill="#7c4dff"/><ellipse cx="12" cy="12" rx="4.2" ry="4.8" fill="#b388ff"/><ellipse cx="12" cy="12" rx="1.8" ry="2.2" fill="#ede7f6"/><path d="M4 7a9 9 0 0 1 6-5M20 17a9 9 0 0 1-6 5" stroke="#e1bee7" stroke-width="1.4" fill="none" stroke-linecap="round"/>',
  swap:'<g fill="none" stroke="#00897b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h15M15 4l4 4-4 4"/><path d="M20 16H5M9 12l-4 4 4 4"/></g>',
  crown:'<path d="M3 18 2 7l5.2 4.2L12 4l4.8 7.2L22 7l-1 11z" fill="#ffca28" stroke="#e65100" stroke-width="1.4" stroke-linejoin="round"/><rect x="3" y="18" width="18" height="3.2" rx="1" fill="#ff8f00" stroke="#e65100" stroke-width="1"/><circle cx="12" cy="13" r="1.8" fill="#e53935"/>',
  revive:'<path d="M12 21.5S3.5 16 3.5 9.8A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8.5 2.8C20.5 16 12 21.5 12 21.5z" fill="#f06292" stroke="#ad1457" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 10v6.5M8.8 13.2h6.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>',
  reload:'<path d="M19 12.5a7 7 0 1 1-2.2-5.4" fill="none" stroke="#ff7043" stroke-width="2.8" stroke-linecap="round"/><path d="M20.5 3.5v6.2h-6.2z" fill="#ff7043" stroke="#bf360c" stroke-width="1" stroke-linejoin="round"/><circle cx="12" cy="12.5" r="2.4" fill="#bf360c"/>',
  coin:'<circle cx="12" cy="12" r="9.5" fill="#ffca28" stroke="#b26a00" stroke-width="1.5"/><circle cx="12" cy="12" r="6" fill="#ffe082" stroke="#b26a00" stroke-width="1.1"/><path d="M12 8.2v7.6M10 10h3.2a1.3 1.3 0 0 1 0 2.6h-2.4a1.3 1.3 0 0 0 0 2.6H14" fill="none" stroke="#b26a00" stroke-width="1.3" stroke-linecap="round"/>',
  coins:'<ellipse cx="12" cy="18" rx="8" ry="3" fill="#ffb300" stroke="#b26a00" stroke-width="1.3"/><ellipse cx="12" cy="14.5" rx="8" ry="3" fill="#ffca28" stroke="#b26a00" stroke-width="1.3"/><ellipse cx="12" cy="11" rx="8" ry="3" fill="#ffd54f" stroke="#b26a00" stroke-width="1.3"/><ellipse cx="12" cy="7.5" rx="8" ry="3" fill="#ffe082" stroke="#b26a00" stroke-width="1.3"/><path d="M9 7.5h6" stroke="#b26a00" stroke-width="1.2" stroke-linecap="round"/>',

function buildDefs(){
  let h='';
  for(const[id,s]of Object.entries(SETS)){if(s.kind!=='vec')continue;
    for(const c of['w','bl']){const p=s[c];h+=`<linearGradient id="gr-${id}-${c==='w'?'w':'b'}" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="${p.t}"/><stop offset="1" stop-color="${p.b}"/></linearGradient>`;}}
  document.getElementById('defs').innerHTML=h;
}
const spriteCache={};
function sprite(type,col,setId){
  const k=setId+type+col;if(spriteCache[k])return spriteCache[k];
  const s=SETS[setId],p=s[col==='w'?'w':'bl'];let svg;
  if(s.kind==='vec'){
    svg=`<svg class="sp" viewBox="0 0 100 100" aria-hidden="true"><g fill="url(#gr-${setId}-${col})" stroke="${p.s}" stroke-width="${s.neon?3:3.6}" stroke-linejoin="round">${SHAPE[type]}${BASE}</g>`+
      `<g fill="none" stroke="${p.a}" stroke-width="2.6" stroke-linecap="round" opacity=".85">${ACCENT[type]}</g><g fill="${p.s}">${ACCENTF[type]}</g></svg>`;
  }else{
    const g=PIX[type],paths={o:'',f:'',h:'',s:''};
    for(let y=0;y<g.length;y++)for(let x=0;x<g[y].length;x++){let ch=g[y][x];if(ch==='.')continue;
      if(ch==='f'){if(g[y][x-1]==='o')ch='h';else if(g[y][x+1]==='o')ch='s';}
      paths[ch]+=`M${x} ${y}h1v1h-1z`;}
    svg=`<svg class="sp" viewBox="-.5 -.5 13 13" shape-rendering="crispEdges" aria-hidden="true">${['o','f','h','s'].map(c=>`<path d="${paths[c]}" fill="${p[c]}"/>`).join('')}</svg>`;
  }
  return spriteCache[k]=svg;
}

function loadProfile(){

/* ---------- Som ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,d,type='sine',v=.12,slide=0,delay=0){
  if(profile.muted)return;const a=ac();if(!a)return;
  try{const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
function noise(d,v=.35,freq=900){
  if(profile.muted)return;const a=ac();if(!a)return;
  try{const n=a.sampleRate*d,buf=a.createBuffer(1,n,a.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
    const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
    s.buffer=buf;g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start();}catch(e){}
}

  thud:()=>{tone(120,.2,'sine',.3,50);noise(.15,.3,400)},
  thunder:()=>{noise(.7,.45,600);tone(70,.6,'sawtooth',.12,40)},
  shield:()=>tone(500,.3,'triangle',.1,900),
  bad:()=>tone(160,.2,'sawtooth',.08,100),
  check:()=>{tone(880,.1,'square',.07);tone(880,.1,'square',.07,0,.15)},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.12,0,i*.12)),
};

/* ---------- Util ---------- */
const $=s=>document.querySelector(s);
const inB=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
const opp=c=>c==='w'?'b':'w';
const key=(r,c)=>r+','+c;
const sqName=(r,c)=>'abcdefgh'[c]+(8-r);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const D4=[[1,0],[-1,0],[0,1],[0,-1]],DX=[[1,1],[1,-1],[-1,1],[-1,-1]],D8=D4.concat(DX);
let uid=0;
function mk(type,color){return{type,color,id:++uid,moved:false,shield:0,frozen:0,cd:0,kills:0,vet:false};}
function initBoard(){
  const B=[...Array(8)].map(()=>Array(8).fill(null)),back=['r','n','b','q','k','b','n','r'];
  for(let c=0;c<8;c++){B[0][c]=mk(back[c],'b');B[1][c]=mk('p','b');B[6][c]=mk('p','w');B[7][c]=mk(back[c],'w');}
  for(const row of B)for(const P of row)if(P)P.cd=START_CD;
  return B;
}

/* ---------- Estado ---------- */
let S=null,gameId=0;
const shielded=P=>P.shield>S.ply;
const frozen=P=>P.frozen>S.ply;
const weaponReady=P=>!frozen(P)&&S.ply>=P.cd;
const cdLeft=P=>Math.max(0,Math.ceil((P.cd-S.ply)/2));
const hittable=(T,col)=>T&&T.color!==col&&(T.type!=='k'||S.ply>=SUDDEN);
const isBot=col=>S.mode==='demo'||(S.mode==='bot'&&col==='b');
const isHumanTurn=()=>!isBot(S.turn);

function newGame(mode,meteors){
  gameId++;
  S={board:initBoard(),turn:'w',mode,opts:{meteors},sel:null,moves:[],pending:null,
     inv:{w:[],b:[]},coins:{w:3,b:3},lost:{w:[],b:[]},ply:0,powerups:{},meteors:[],
     ep:null,last:null,extra:false,usedItem:false,over:false,winner:null,anim:null,logs:[],gid:gameId};
  spawnPowerup();spawnPowerup();
  addLog(`${ic('sparkle')} Nova partida! Toda peça tem uma arma: selecione uma peça e clique em <b>Atacar</b>.`);
  render();maybeBot();
}

/* =====================================================================
   MOVIMENTOS
   ===================================================================== */
function pseudoMoves(B,r,c,ep){
  const P=B[r][c];if(!P||frozen(P))return[];
  const col=P.color,out=[];
  const tryAdd=(tr,tc)=>{if(!inB(tr,tc))return false;const T=B[tr][tc];
    if(T){if(T.color!==col&&!shielded(T))out.push({fr:r,fc:c,tr,tc,cap:true});return false;}
    out.push({fr:r,fc:c,tr,tc});return true;};
  const slide=dirs=>{for(const[dr,dc]of dirs){let tr=r+dr,tc=c+dc;while(tryAdd(tr,tc)){tr+=dr;tc+=dc;}}};
  switch(P.type){
    case'r':slide(D4);break;
    case'b':slide(DX);break;
    case'q':slide(D8);break;
    case'n':for(const[dr,dc]of[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]])tryAdd(r+dr,c+dc);break;
    case'k':{
      for(const[dr,dc]of D8)tryAdd(r+dr,c+dc);
      const home=col==='w'?7:0;
      if(!P.moved&&r===home&&c===4){
        const rk=B[r][7],rq=B[r][0];
        if(rk&&rk.type==='r'&&rk.color===col&&!rk.moved&&!B[r][5]&&!B[r][6])out.push({fr:r,fc:c,tr:r,tc:6,castle:'k'});
        if(rq&&rq.type==='r'&&rq.color===col&&!rq.moved&&!B[r][1]&&!B[r][2]&&!B[r][3])out.push({fr:r,fc:c,tr:r,tc:2,castle:'q'});
      }break;}
    case'p':{
      const d=col==='w'?-1:1,start=col==='w'?6:1;
      if(inB(r+d,c)&&!B[r+d][c]){out.push({fr:r,fc:c,tr:r+d,tc:c});
        if(r===start&&inB(r+2*d,c)&&!B[r+2*d][c])out.push({fr:r,fc:c,tr:r+2*d,tc:c});}
      for(const dc of[-1,1]){const tr=r+d,tc=c+dc;if(!inB(tr,tc))continue;const T=B[tr][tc];
        if(T){if(T.color!==col&&!shielded(T))out.push({fr:r,fc:c,tr,tc,cap:true});}
        else if(ep&&ep.r===tr&&ep.c===tc){const V=B[r][tc];if(V&&V.type==='p'&&V.color!==col&&!shielded(V))out.push({fr:r,fc:c,tr,tc,cap:true,ep:true});}
      }}
  }
  return out;
}
function allMoves(B,col,ep){const out=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){const P=B[r][c];if(P&&P.color===col)out.push(...pseudoMoves(B,r,c,ep));}return out;}
function findKing(B,col){for(let r=0;r<8;r++)for(let c=0;c<8;c++){const P=B[r][c];if(P&&P.type==='k'&&P.color===col)return[r,c];}return null;}
function kingAttacked(B,col){const k=findKing(B,col);if(!k)return false;return allMoves(B,opp(col),null).some(m=>m.tr===k[0]&&m.tc===k[1]);}

/* =====================================================================
   AÇÕES
   ===================================================================== */
function onKill(P,r,c){
  P.kills++;
  if(P.kills===2&&!P.vet){P.vet=true;P.shield=S.ply+4;P.cd=0;setTimeout(()=>fxText(r,c,'Veterano!','#fff176'),350);addLog(`${ic('star')} ${NAMES[P.type]} virou Veterano: escudo grátis e arma recarregada!`);}
}
function doMove(m){
  const B=S.board,P=B[m.fr][m.fc],col=P.color;
  let T=B[m.tr][m.tc],tr=m.tr,tc=m.tc;
  if(m.ep){T=B[m.fr][m.tc];B[m.fr][m.tc]=null;tr=m.fr;tc=m.tc;}
  B[m.tr][m.tc]=P;B[m.fr][m.fc]=null;P.moved=true;
  let txt=`${COLOR_NAME[col]}: ${NAMES[P.type]} ${sqName(m.fr,m.fc)}→${sqName(m.tr,m.tc)}`;
  if(T){
    S.lost[T.color].push(T.type);S.coins[col]+=VAL[T.type];
    txt=`${ic('swords')} ${txt} captura ${NAMES[T.type]}!`;
    fxBurst(tr,tc,T.type==='k'?'#ffd600':'#fff59d',12);
    if(VAL[T.type])fxText(m.tr,m.tc,`+${VAL[T.type]} moedas`,'#ffd54f');
    SFX.capture();onKill(P,m.tr,m.tc);
  }else SFX.move();
  if(m.castle){const row=m.tr;if(m.castle==='k'){B[row][5]=B[row][7];B[row][7]=null;B[row][5].moved=true;}else{B[row][3]=B[row][0];B[row][0]=null;B[row][3].moved=true;}txt+=' (roque)';}
  S.ep=(P.type==='p'&&Math.abs(m.tr-m.fr)===2)?{r:(m.tr+m.fr)/2,c:m.fc}:null;
  S.last={fr:m.fr,fc:m.fc,tr:m.tr,tc:m.tc};S.anim=key(m.tr,m.tc);
  addLog(txt);
  if(T&&T.type==='k'){gameOver(col,'O Rei foi capturado!');return;}
  promoteCheck(m.tr,m.tc);
  landOn(m.tr,m.tc);
  endAction();
}
function promoteCheck(r,c){
  const P=S.board[r][c];if(P&&P.type==='p'&&(r===0||r===7)){P.type='q';P.cd=0;setTimeout(()=>fxText(r,c,'Promovido!','#ffd54f'),200);SFX.power();addLog(`${ic('crown')} Peão promovido a Dama em ${sqName(r,c)}!`);}
}
function landOn(r,c){
  const P=S.board[r][c];if(!P)return;const k=key(r,c);
  if(S.powerups[k]){const id=S.powerups[k];delete S.powerups[k];giveItem(P.color,id,r,c);}
}
function giveItem(col,id,r,c){
  fxIcon(r,c,id==='coins'?'coins':id);
  if(id==='coins'){S.coins[col]+=5;fxText(r,c,'+5 moedas','#ffd54f');SFX.coin();addLog(`${ic('coins')} ${COLOR_NAME[col]} pegaram um saco de moedas!`);return;}
  if(S.inv[col].length>=5){S.coins[col]+=3;fxText(r,c,'Mochila cheia: +3','#ffd54f');SFX.coin();return;}
  S.inv[col].push(id);fxText(r,c,ITEMS[id].name+'!','#d1c4ff');SFX.power();
  addLog(`${ic(id)} ${COLOR_NAME[col]} pegaram: ${ITEMS[id].name}`);
}
function destroy(r,c,byCol,killer){
  const P=S.board[r][c];if(!P)return false;
  if(shielded(P)){P.shield=0;fxText(r,c,'Bloqueado!','#80d8ff');SFX.shield();return false;}
  if(P.type==='k'){
    if(S.ply<SUDDEN){fxText(r,c,'Rei imune!','#fff');return false;}
    S.board[r][c]=null;S.lost[P.color].push('k');fxBurst(r,c,'#ffd600',14);gameOver(opp(P.color),'Morte súbita: o Rei foi destruído!');return true;
  }
  S.board[r][c]=null;S.lost[P.color].push(P.type);
  if(byCol&&P.color!==byCol){S.coins[byCol]+=VAL[P.type];if(killer)onKill(killer,r,c);}
  fxBurst(r,c,'#ff7043',9);fxBurst(r,c,'#ffeb3b',5);
  return true;
}
function endAction(){
  if(S.over)return;
  if(S.extra){S.extra=false;S.usedItem=false;S.sel=null;S.moves=[];addLog(`${ic('double')} Ação extra!`);render();maybeBot();return;}
  endTurn();
}
function endTurn(){
  S.ply++;S.turn=opp(S.turn);S.sel=null;S.moves=[];S.pending=null;S.usedItem=false;S.extra=false;
  S.coins[S.turn]+=1;
  const hit=S.meteors.filter(m=>m.at<=S.ply);S.meteors=S.meteors.filter(m=>m.at>S.ply);
  if(hit.length){SFX.boom();shake();let n=0;for(const m of hit){fxBoom(m.r,m.c);delete S.powerups[key(m.r,m.c)];if(destroy(m.r,m.c,null))n++;if(S.over)return;}addLog(`${ic('meteor')} Chuva de meteoros! ${n} peça(s) destruída(s).`);}
  if(S.ply%3===0)spawnPowerup();
  if(S.ply===SUDDEN){addLog(`${ic('skull')} MORTE SÚBITA! Agora os Reis também podem ser atingidos por armas e meteoros.`);SFX.bad();}
  if(S.ply>=8&&((S.opts.meteors&&S.ply%10===0)||(S.ply>=SUDDEN&&S.ply%5===0)))scheduleMeteors();
  if(kingAttacked(S.board,S.turn)){SFX.check();addLog(`${ic('warn')} Xeque nas ${COLOR_NAME[S.turn]}!`);}
  render();maybeBot();
}
function spawnPowerup(){
  if(Object.keys(S.powerups).length>=4)return;
  const empty=[];for(let r=2;r<=5;r++)for(let c=0;c<8;c++){const k=key(r,c);if(!S.board[r][c]&&!S.powerups[k])empty.push(k);}
  if(!empty.length)return;
  const tot=SPAWN_POOL.reduce((a,b)=>a+b[1],0);let x=Math.random()*tot,id='coins';
  for(const[i,w]of SPAWN_POOL){if((x-=w)<0){id=i;break;}}
  S.powerups[rnd(empty)]=id;
}
function scheduleMeteors(){
  const all=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){const P=S.board[r][c];if(!P||P.type!=='k'||S.ply>=SUDDEN-2)all.push([r,c]);}
  for(let i=0;i<3&&all.length;i++){const j=Math.floor(Math.random()*all.length);const[r,c]=all.splice(j,1)[0];S.meteors.push({r,c,at:S.ply+2});}
  addLog(`${ic('meteor')} Meteoros a caminho! Saiam das casas marcadas!`);SFX.bad();
}
function gameOver(win,why){
  if(S.over)return;
  S.over=true;S.winner=win;S.pending=null;S.sel=null;S.moves=[];
  SFX.win();setTimeout(()=>addLog(`${ic('trophy')} ${COLOR_NAME[win]} vencem! ${why}`),0);
  let gems=0;const mat=c=>S.lost[opp(c)].reduce((a,t)=>a+VAL[t],0);
  if(S.mode==='bot')gems=(win==='w'?25:5)+mat('w');
  else if(S.mode==='2p')gems=15+Math.floor((mat('w')+mat('b'))/2);
  if(gems){profile.gems+=gems;saveProfile();}
  render();
  const g=S.gid;
  setTimeout(()=>{if(S.gid!==g)return;showGameOver(win,why,gems);},900);
}

/* =====================================================================
   ARMAS DAS PEÇAS
   ===================================================================== */
function cannonHits(r,c,dr,dc,col){
  const hits=[];let tr=r+dr,tc=c+dc;
  while(inB(tr,tc)&&hits.length<2){const T=S.board[tr][tc];if(T){if(!hittable(T,col))break;hits.push([tr,tc]);}tr+=dr;tc+=dc;}
  return hits;
}
function cannonDirs(r,c,col){const out=[];for(const[dr,dc]of D4){const h=cannonHits(r,c,dr,dc,col);if(h.length)out.push({dr,dc,hits:h,first:h[0]});}return out;}
function hammerVictims(r,c,col){const out=[];for(const[dr,dc]of D8){const tr=r+dr,tc=c+dc;if(!inB(tr,tc))continue;const T=S.board[tr][tc];if(T&&T.color!==col&&T.type!=='k')out.push([tr,tc]);}return out;}
function weaponTargets(r,c){
  const B=S.board,P=B[r][c];if(!P||!weaponReady(P))return[];
  const col=P.color,out=[];
  const ray=(dirs,range)=>{for(const[dr,dc]of dirs){for(let s=1;s<=range;s++){const tr=r+dr*s,tc=c+dc*s;if(!inB(tr,tc))break;const T=B[tr][tc];if(T){if(hittable(T,col))out.push([tr,tc]);break;}}}};
  switch(P.type){
    case'p':ray([[col==='w'?-1:1,0]],2);break;
    case'b':ray(DX,4);break;
    case'n':for(const[dr,dc]of D8){const tr=r+dr,tc=c+dc;if(inB(tr,tc)&&hittable(B[tr][tc],col))out.push([tr,tc]);}break;
    case'r':out.push(...cannonDirs(r,c,col).map(d=>d.first));break;
    case'q':for(let tr=r-3;tr<=r+3;tr++)for(let tc=c-3;tc<=c+3;tc++)if(inB(tr,tc)&&!(tr===r&&tc===c))out.push([tr,tc]);break;
    case'k':if(hammerVictims(r,c,col).length)out.push([r,c]);break;
  }
  return out;
}
function startWeapon(){
  if(!S||S.over||!isHumanTurn()||!S.sel)return;
  const{r,c}=S.sel,P=S.board[r][c];if(!P||P.color!==S.turn)return;
  if(frozen(P)){toast('Peça congelada não pode atacar!');SFX.bad();return;}
  if(!weaponReady(P)){toast(`${WEAPONS[P.type].name} recarregando: ${cdLeft(P)} turno(s).`);SFX.bad();return;}
  const t=weaponTargets(r,c);
  if(!t.length){toast(`Nenhum alvo ao alcance do ${WEAPONS[P.type].name}.`);SFX.bad();return;}
  if(P.type==='k'){S.sel=null;S.moves=[];useWeapon(r,c,r,c);return;}
  S.pending={kind:'weapon',r,c};S.moves=[];render();
}
function useWeapon(r,c,tr,tc){
  const B=S.board,P=B[r][c],col=P.color,W=WEAPONS[P.type],who=COLOR_NAME[col];
  P.cd=S.ply+W.cd*2;S.pending=null;S.sel=null;S.moves=[];S.last=null;
  fxIcon(r,c,W.icon);
  switch(P.type){
    case'p':{fxProjectile(r,c,tr,tc,'spear');SFX.stab();const T=B[tr][tc];const ok=destroy(tr,tc,col,P);
      addLog(`${ic('spear')} ${who}: Lança do Peão em ${sqName(tr,tc)}${ok?` derruba ${NAMES[T.type]}!`:'.'}`);break;}
    case'b':{fxBeam(r,c,tr,tc,'linear-gradient(90deg,#8d6e63,#fff59d)');fxProjectile(r,c,tr,tc,'bow');SFX.whoosh();const T=B[tr][tc];const ok=destroy(tr,tc,col,P);
      if(ok)fxText(tr,tc,'Na mosca!','#fff');addLog(`${ic('bow')} ${who}: flecha do Bispo em ${sqName(tr,tc)}${ok?` derruba ${NAMES[T.type]}!`:'.'}`);break;}
    case'r':{const d=cannonDirs(r,c,col).find(d=>d.first[0]===tr&&d.first[1]===tc);
      let er=r,ec=c;while(inB(er+d.dr,ec+d.dc)){er+=d.dr;ec+=d.dc;}
      fxBeam(r,c,er,ec,'linear-gradient(90deg,#ff1744,#ffea00)');SFX.boom();shake();
      let n=0;for(const[hr,hc]of d.hits){if(destroy(hr,hc,col,P))n++;if(S.over)return;}
      addLog(`${ic('cannon')} ${who}: Canhão da Torre atinge ${n} peça(s)!`);break;}
    case'q':{fxProjectile(r,c,tr,tc,'bomb');const g=S.gid;
      setTimeout(()=>{if(S.gid===g)fxBoom(tr,tc);},280);SFX.whoosh();setTimeout(()=>{SFX.boom();shake();},260);
      let n=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const xr=tr+dr,xc=tc+dc;if(!inB(xr,xc))continue;delete S.powerups[key(xr,xc)];if(destroy(xr,xc,col,B[xr][xc]===P?null:P))n++;if(S.over)return;}
      addLog(`${ic('bomb')} ${who}: Bomba da Dama em ${sqName(tr,tc)} — ${n} peça(s) destruída(s)!`);break;}
    case'n':{const T=B[tr][tc],dr=tr-r,dc=tc-c,nr=tr+dr,nc=tc+dc;SFX.thud();fxIcon(tr,tc,'boom');
      if(shielded(T)){destroy(tr,tc,col,P);addLog(`${ic('horseshoe')} ${who}: Coice do Cavalo bloqueado por escudo.`);break;}
      if(inB(nr,nc)&&!B[nr][nc]){B[nr][nc]=T;B[tr][tc]=null;S.anim=key(nr,nc);fxText(nr,nc,'Empurrado!','#fff');
        addLog(`${ic('horseshoe')} ${who}: Coice do Cavalo empurra ${NAMES[T.type]} para ${sqName(nr,nc)}.`);landOn(nr,nc);}
      else{destroy(tr,tc,col,P);fxText(tr,tc,'Esmagado!','#ff8a80');shake();addLog(`${ic('horseshoe')} ${who}: Coice do Cavalo esmaga ${NAMES[T.type]}!`);}
      break;}
    case'k':{const v=hammerVictims(r,c,col);SFX.thunder();shake();fxWave(r,c);let n=0;
      for(const[vr,vc]of v){const T=B[vr][vc];if(shielded(T)){T.shield=0;fxText(vr,vc,'Bloqueado!','#80d8ff');continue;}T.frozen=Math.max(T.frozen,S.ply+3);fxIcon(vr,vc,'freeze');n++;}
      addLog(`${ic('hammer')} ${who}: Martelo do Trovão atordoa ${n} inimigo(s)!`);break;}
  }
  if(S.over)return;
  endAction();
}

/* =====================================================================
   ITENS (power-ups)
   ===================================================================== */
function bestLost(col){const l=S.lost[col].filter(t=>t!=='k');if(!l.length)return null;return l.sort((a,b)=>VAL[b]-VAL[a])[0];}
function itemTargets(p,col){
  const B=S.board,out=[];
  const each=f=>{for(let r=0;r<8;r++)for(let c=0;c<8;c++)f(r,c,B[r][c]);};
  switch(p.id){
    case'shield':each((r,c,P)=>{if(P&&P.color===col&&!shielded(P))out.push([r,c]);});break;
    case'freeze':each((r,c,P)=>{if(P&&P.color!==col&&P.type!=='k'&&!shielded(P)&&!frozen(P))out.push([r,c]);});break;
    case'crown':each((r,c,P)=>{if(P&&P.color===col&&P.type==='p')out.push([r,c]);});break;
    case'revive':if(bestLost(col)){const home=col==='w'?[6,7]:[0,1];each((r,c,P)=>{if(home.includes(r)&&!P)out.push([r,c]);});}break;
    case'teleport':
      if(p.step===0)each((r,c,P)=>{if(P&&P.color===col)out.push([r,c]);});
      else{const P=B[p.data.r][p.data.c];each((r,c,T)=>{if(!T&&!(P.type==='p'&&(r===0||r===7)))out.push([r,c]);});}
      break;
    case'swap':
      if(p.step===0)each((r,c,P)=>{if(P&&P.color===col)out.push([r,c]);});
      else each((r,c,P)=>{if(P&&P.color===col&&!(r===p.data.r&&c===p.data.c))out.push([r,c]);});
      break;
  }
  return out;
}
function startItem(idx){
  if(!S||S.over||!isHumanTurn())return;
  if(S.usedItem){toast('Só 1 item por turno!');return;}
  const id=S.inv[S.turn][idx];if(!id)return;
  S.sel=null;S.moves=[];
  if(id==='double'||id==='reload'){applyItem(id,S.turn);return;}
  const p={kind:'item',id,step:0,data:{}};
  if(!itemTargets(p,S.turn).length){toast(`Sem alvos para ${ITEMS[id].name} agora.`);SFX.bad();return;}
  S.pending=p;render();
}
function cancelPending(){if(S&&S.pending){S.pending=null;render();}}
function handlePendingClick(r,c){
  const p=S.pending,col=S.turn;
  if(p.kind==='weapon'){
    if(weaponTargets(p.r,p.c).some(([a,b])=>a===r&&b===c)){useWeapon(p.r,p.c,r,c);return;}
    cancelPending();return;
  }
  if(!itemTargets(p,col).some(([a,b])=>a===r&&b===c)){
    if(p.step===1){p.step=0;p.data={};render();return;}
    cancelPending();return;
  }
  if((p.id==='teleport'||p.id==='swap')&&p.step===0){p.step=1;p.data={r,c};render();return;}
  applyItem(p.id,col,p.data,r,c);
}
function applyItem(id,col,data,r,c){
  const inv=S.inv[col],i=inv.indexOf(id);if(i<0)return;
  inv.splice(i,1);S.usedItem=true;S.pending=null;
  const B=S.board,it=ITEMS[id],who=COLOR_NAME[col];
  switch(id){
    case'double':S.extra=true;SFX.power();addLog(`${ic('double')} ${who} ativaram Turno Duplo!`);if(!isBot(col))toast('Turno duplo! Você terá 2 ações.');break;
    case'reload':{let n=0;for(const row of B)for(const P of row)if(P&&P.color===col&&P.cd>S.ply){P.cd=0;n++;}SFX.power();addLog(`${ic('reload')} ${who} recarregaram ${n} arma(s)!`);if(!isBot(col))toast('Todas as suas armas estão prontas!');break;}
    case'shield':B[r][c].shield=S.ply+4;fxIcon(r,c,'shield');SFX.shield();addLog(`${ic('shield')} ${who} protegeram ${NAMES[B[r][c].type]} em ${sqName(r,c)}`);break;
    case'freeze':B[r][c].frozen=S.ply+5;fxBurst(r,c,'#b3e5fc',10);fxIcon(r,c,'freeze');SFX.freeze();addLog(`${ic('freeze')} ${who} congelaram ${NAMES[B[r][c].type]} em ${sqName(r,c)}`);break;
    case'crown':B[r][c].type='q';B[r][c].cd=0;fxIcon(r,c,'crown');fxText(r,c,'Rainha!','#ffd54f');SFX.power();addLog(`${ic('crown')} ${who} coroaram um peão!`);break;
    case'revive':{const t=bestLost(col);S.lost[col].splice(S.lost[col].indexOf(t),1);const P=mk(t,col);P.moved=true;B[r][c]=P;S.anim=key(r,c);fxIcon(r,c,'revive');fxText(r,c,`${NAMES[t]} reviveu!`,'#f48fb1');SFX.power();addLog(`${ic('revive')} ${who} reviveram: ${NAMES[t]}`);break;}
    case'teleport':{const P=B[data.r][data.c];B[data.r][data.c]=null;B[r][c]=P;P.moved=true;S.ep=null;fxIcon(data.r,data.c,'teleport');fxIcon(r,c,'teleport');S.anim=key(r,c);SFX.zap();
      addLog(`${ic('teleport')} ${who} teletransportaram ${NAMES[P.type]} para ${sqName(r,c)}`);landOn(r,c);break;}
    case'swap':{const P=B[data.r][data.c],Q=B[r][c];B[data.r][data.c]=Q;B[r][c]=P;S.ep=null;fxIcon(data.r,data.c,'swap');fxIcon(r,c,'swap');SFX.zap();
      addLog(`${ic('swap')} ${who} trocaram ${NAMES[P.type]} e ${NAMES[Q.type]} de lugar`);promoteCheck(r,c);promoteCheck(data.r,data.c);break;}
  }
  if(it.free){render();return;}
  endAction();
}
function buyItem(id){
  const col=S.turn;if(S.over||!isHumanTurn())return;
  const it=ITEMS[id];if(S.coins[col]<it.price||S.inv[col].length>=5)return;
  S.coins[col]-=it.price;S.inv[col].push(id);SFX.coin();addLog(`${ic('cart')} ${COLOR_NAME[col]} compraram ${it.name}`);
  render();showShop();
}

/* =====================================================================
   BOT
   ===================================================================== */
function maybeBot(){
  if(!S||S.over||!isBot(S.turn))return;
  const g=S.gid,delay=S.mode==='demo'?420:650;
  setTimeout(()=>{if(S.gid===g&&!S.over&&isBot(S.turn))botAct();},delay);
}
function defended(B,r,c,col){const B3=B.map(x=>x.slice());B3[r][c]={type:'p',color:opp(col),shield:0,frozen:0};return allMoves(B3,col,null).some(m=>m.tr===r&&m.tc===c);}
function worstThreat(B2,col){
  let worst=0;
  for(const em of allMoves(B2,opp(col),null)){
    if(!em.cap)continue;const v=B2[em.tr][em.tc];if(!v)continue;
    let val=v.type==='k'?50000:VAL[v.type]*10;
    if(v.type!=='k'&&defended(B2,em.tr,em.tc,col))val=Math.max(0,val-VAL[B2[em.fr][em.fc].type]*10);
    if(val>worst)worst=val;
  }
  return worst;
}
function botAct(){
  const col=S.turn;
  botShop(col);
  if(!S.usedItem){const r=botItem(col);if(r==='turn')return;if(r==='free'){maybeBot();return;}}
  const ms=allMoves(S.board,col,S.ep);
  let best=null,bs=-Infinity;for(const m of ms){const s=scoreMove(m,col);if(s>bs){bs=s;best=m;}}
  const w=botWeapon(col);
  if(w){const ws=w.v*10+2-worstThreat(S.board,col)*.9;if(!best||ws>bs){useWeapon(w.r,w.c,w.tr,w.tc);return;}}
  if(!best){addLog(`${COLOR_NAME[col]} não têm ações e passam a vez.`);endTurn();return;}
  doMove(best);
}
function botShop(col){
  const inv=S.inv[col];if(inv.length>=3||Math.random()<.5)return;
  const wish=['double','reload','shield','freeze','crown'].filter(id=>ITEMS[id].price<=S.coins[col]);
  if(!wish.length)return;const id=wish[0];S.coins[col]-=ITEMS[id].price;inv.push(id);addLog(`${ic('cart')} ${COLOR_NAME[col]} compraram ${ITEMS[id].name}`);
}
function scoreMove(m,col){
  const B=S.board,P=B[m.fr][m.fc];
  let s=Math.random()*4;
  const victim=m.ep?B[m.fr][m.tc]:B[m.tr][m.tc];
  if(victim)s+=victim.type==='k'?100000:VAL[victim.type]*10;
  if(S.powerups[key(m.tr,m.tc)])s+=13;
  if(P.type!=='k'&&S.meteors.some(x=>x.r===m.tr&&x.c===m.tc))s-=VAL[P.type]*9;
  if(P.type!=='k'&&S.meteors.some(x=>x.r===m.fr&&x.c===m.fc))s+=VAL[P.type]*8;
  if(P.type==='p'&&(m.tr===0||m.tr===7))s+=80;
  if(m.castle)s+=8;
  s+=(3.5-Math.abs(3.5-m.tc))*.5;
  if(P.type==='p')s+=.6;
  if(P.type==='k'&&!m.castle&&S.ply<30)s-=3;
  const B2=B.map(x=>x.slice());B2[m.tr][m.tc]=P;B2[m.fr][m.fc]=null;if(m.ep)B2[m.fr][m.tc]=null;
  if(m.castle){const row=m.tr;if(m.castle==='k'){B2[row][5]=B2[row][7];B2[row][7]=null;}else{B2[row][3]=B2[row][0];B2[row][0]=null;}}
  return s-worstThreat(B2,col)*.9;
}
function pieceVal(T,col){if(!T)return 0;if(T.type==='k'){if(S.ply<SUDDEN||shielded(T))return 0;return T.color!==col?100:-100;}if(shielded(T))return T.color!==col?.5:0;return T.color!==col?VAL[T.type]:-VAL[T.type]*1.3;}
function botWeapon(col){
  const B=S.board;let best=null;
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const P=B[r][c];if(!P||P.color!==col||!weaponReady(P))continue;
    for(const[tr,tc]of weaponTargets(r,c)){
      let v=0;
      switch(P.type){
        case'p':case'b':v=pieceVal(B[tr][tc],col);break;
        case'r':{const d=cannonDirs(r,c,col).find(d=>d.first[0]===tr&&d.first[1]===tc);v=d.hits.reduce((a,[hr,hc])=>a+pieceVal(B[hr][hc],col),0);break;}
        case'q':for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const xr=tr+dr,xc=tc+dc;if(inB(xr,xc))v+=pieceVal(B[xr][xc],col);}break;
        case'n':{const T=B[tr][tc],nr=tr+(tr-r),nc=tc+(tc-c);v=shielded(T)?.5:(inB(nr,nc)&&!B[nr][nc])?.4:pieceVal(T,col);break;}
        case'k':v=hammerVictims(r,c,col).reduce((a,[vr,vc])=>a+VAL[B[vr][vc].type]*.4,0);break;
      }
      if(v>=1&&(!best||v>best.v))best={r,c,tr,tc,v};
    }
  }
  return best;
}
function botItem(col){
  const inv=S.inv[col];if(!inv.length)return false;
  const has=id=>inv.includes(id),B=S.board,en=opp(col);
  const threats=allMoves(B,en,S.ep).filter(m=>m.cap).map(m=>[m.tr,m.tc,m.fr,m.fc]);
  const kingIn=kingAttacked(B,col),kp=findKing(B,col);
  if(kingIn&&kp){
    if(has('shield')&&!shielded(B[kp[0]][kp[1]])){applyItem('shield',col,null,kp[0],kp[1]);return'free';}
    if(has('freeze')){const t=threats.find(t=>t[0]===kp[0]&&t[1]===kp[1]);if(t){const A=B[t[2]][t[3]];if(A.type!=='k'&&!shielded(A)&&!frozen(A)){applyItem('freeze',col,null,t[2],t[3]);return'free';}}}
    if(has('teleport')){const sq=itemTargets({id:'teleport',step:1,data:{r:kp[0],c:kp[1]}},col).filter(([r,c])=>{const B2=B.map(x=>x.slice());B2[r][c]=B2[kp[0]][kp[1]];B2[kp[0]][kp[1]]=null;return!kingAttacked(B2,col);});
      if(sq.length){const[r,c]=rnd(sq);applyItem('teleport',col,{r:kp[0],c:kp[1]},r,c);return'turn';}}
  }
  if(has('double')){applyItem('double',col);return'free';}
  if(has('reload')){let n=0;for(const row of B)for(const P of row)if(P&&P.color===col&&P.cd>S.ply&&VAL[P.type]>=3)n++;if(n>=2){applyItem('reload',col);return'free';}}
  if(has('shield')){const t=threats.map(t=>[t[0],t[1]]).filter(([r,c])=>B[r][c]&&VAL[B[r][c].type]>=5&&!defended(B,r,c,col)).sort((a,b)=>VAL[B[b[0]][b[1]].type]-VAL[B[a[0]][a[1]].type])[0];
    if(t){applyItem('shield',col,null,t[0],t[1]);return'free';}}
  if(has('freeze')){const t=threats.filter(t=>B[t[0]][t[1]]&&VAL[B[t[0]][t[1]].type]>=3).map(t=>[t[2],t[3]]).filter(x=>B[x[0]][x[1]].type!=='k'&&!shielded(B[x[0]][x[1]])&&!frozen(B[x[0]][x[1]]))[0];
    if(t){applyItem('freeze',col,null,t[0],t[1]);return'free';}}
  if(has('crown')){let pw=null;for(let r=0;r<8;r++)for(let c=0;c<8;c++){const P=B[r][c];if(P&&P.color===col&&P.type==='p'){const adv=col==='b'?r:7-r;if(!pw||adv>pw[2])pw=[r,c,adv];}}if(pw&&pw[2]>=3){applyItem('crown',col,null,pw[0],pw[1]);return'turn';}}
  if(has('revive')){const t=bestLost(col);if(t&&VAL[t]>=3){const sq=itemTargets({id:'revive',step:0},col);if(sq.length){const[r,c]=rnd(sq);applyItem('revive',col,null,r,c);return'turn';}}}
  return false;
}

function pieceHTML(P,anim){
  const st=profile.set,s=SETS[st],fz=frozen(P),sh=shielded(P);
  let badges='';
  if(sh)badges+=`<span class="badge b-shield">${ic('shield','')}</span>`;
  if(fz)badges+=`<span class="badge b-frozen">${ic('freeze','')}</span>`;
  if(P.vet)badges+=`<span class="badge b-vet">${ic('star','')}</span>`;
  if(S&&!S.over&&P.color===S.turn&&!isBot(P.color)&&weaponReady(P))badges+='<span class="wdot"></span>';
  const glow=s.neon?` style="--glow:${s[P.color==='w'?'w':'bl'].s}"`:'';
  return `<div class="pc ${s.kind==='pix'?'pixel':''} ${s.neon?'neon':''}${fz?' is-frozen':''}${sh?' is-shield':''}${anim?' pop':''}"${glow}>${sprite(P.type,P.color,st)}${badges}</div>`;
}
function miniHTML(type,color,setId){const st=setId||profile.set,s=SETS[st];const glow=s.neon?` style="--glow:${s[color==='w'?'w':'bl'].s}"`:'';return `<div class="pc ${s.kind==='pix'?'pixel':''} ${s.neon?'neon':''}"${glow}>${sprite(type,color,st)}</div>`;}
let hoverSq=null;
function render(){
  const B=S.board,col=S.turn;
  let tgts=[],wmode=false,isBomb=false;
  if(S.pending){if(S.pending.kind==='weapon'){tgts=weaponTargets(S.pending.r,S.pending.c);wmode=true;isBomb=B[S.pending.r][S.pending.c]?.type==='q';}else tgts=itemTargets(S.pending,col);}
  const tset=new Set(tgts.map(([r,c])=>key(r,c)));
  const blast=new Set();
  if(isBomb&&hoverSq&&tset.has(key(hoverSq[0],hoverSq[1])))for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)blast.add(key(hoverSq[0]+dr,hoverSq[1]+dc));
  const mmap=new Map(S.moves.map(m=>[key(m.tr,m.tc),m]));
  const kc=!S.over&&kingAttacked(B,col)?findKing(B,col):null;
  let h='';
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const k=key(r,c),P=B[r][c];
    let cls='sq '+((r+c)%2?'d':'l');
    if(S.last&&((S.last.fr===r&&S.last.fc===c)||(S.last.tr===r&&S.last.tc===c)))cls+=' last';
    if(S.sel&&S.sel.r===r&&S.sel.c===c)cls+=' sel';
    if(S.pending&&S.pending.kind==='weapon'&&S.pending.r===r&&S.pending.c===c)cls+=' sel';
    if(S.pending&&S.pending.kind==='item'&&S.pending.step===1&&S.pending.data.r===r&&S.pending.data.c===c)cls+=' sel';
    if(tset.has(k))cls+=wmode?(isBomb?' wtgt area':' wtgt'):' tgt';
    if(blast.has(k))cls+=' blast';
    if(kc&&kc[0]===r&&kc[1]===c)cls+=' check';
    let inner='';
    if(c===0)inner+=`<span class="coord rk">${8-r}</span>`;
    if(r===7)inner+=`<span class="coord fl">${'abcdefgh'[c]}</span>`;
    if(S.powerups[k]){const id=S.powerups[k];inner+=`<span class="pu">${ic(id==='coins'?'coins':id,'')}</span>`;}
    if(P)inner+=pieceHTML(P,S.anim===k);
    const m=mmap.get(k);if(m)inner+=m.cap?'<span class="ring"></span>':'<span class="dot"></span>';
    if(S.meteors.some(x=>x.r===r&&x.c===c))inner+=`<span class="meteor">${ic('meteor','')}</span>`;
    h+=`<div class="${cls}" data-r="${r}" data-c="${c}" role="button" aria-label="${sqName(r,c)}">${inner}</div>`;
  }
  $('#board').innerHTML=h;S.anim=null;
  const bt=BOARDS[profile.board],w=$('#wrap');w.style.setProperty('--sq-l',bt.l);w.style.setProperty('--sq-d',bt.d);
  renderPanels();renderStatus(kc);
  $('#gems').innerHTML=ic('gem')+' '+profile.gems;
  $('#bMute').innerHTML=ic(profile.muted?'mute':'sound');
}
function renderPanels(){
  for(const col of['b','w']){
    const el=$('#panel-'+col),me=S.turn===col&&!S.over,human=!isBot(col);
    const inv=S.inv[col];let slots='';
    for(let i=0;i<5;i++){const id=inv[i];
      if(id){const it=ITEMS[id],can=me&&human&&!S.usedItem&&!S.pending;slots+=`<button class="slot" title="${it.name}: ${it.desc}" aria-label="${it.name}" ${can?'':'disabled'} data-item="${i}">${ic(id,'')}</button>`;}
      else slots+='<div class="slot"></div>';}
    const capt=S.lost[opp(col)].slice().sort((a,b)=>VAL[b]-VAL[a]).map(t=>`<span class="mini">${miniHTML(t,opp(col))}</span>`).join('');
    let ready=0,total=0;for(const row of S.board)for(const P of row)if(P&&P.color===col){total++;if(weaponReady(P))ready++;}
    el.innerHTML=`<div class="ph"><div class="pname"><span class="chip ${col}"></span>${COLOR_NAME[col]}${isBot(col)?' '+ic('bot'):''}</div>${me?'<span class="turnflag">SUA VEZ</span>':''}</div>
      <div class="ph" style="margin-top:6px"><span class="coins">${ic('coin')} ${S.coins[col]}</span><span class="hint" style="margin:0">armas prontas: <b>${ready}/${total}</b></span></div>
      <div class="lbl">Mochila</div><div class="inv">${slots}</div>
      ${human?`<div class="row"><button class="btn small" data-shop="1" ${me?'':'disabled'}>${ic('cart')} Loja de itens</button></div>`:''}
      <div class="lbl">Capturadas</div><div class="lost">${capt||'<span class="hint" style="margin:0">nenhuma ainda</span>'}</div>`;

}
function renderStatus(kc){
  const st=$('#status');st.classList.remove('alert');
  if(S.over){st.innerHTML=`${ic('trophy')} <b>${COLOR_NAME[S.winner]} venceram!</b> <button class="btn small" id="sNew">Jogar de novo</button>`;return;}
  if(S.pending){
    if(S.pending.kind==='weapon'){const P=S.board[S.pending.r][S.pending.c],W=WEAPONS[P.type];
      st.innerHTML=`${ic(W.icon)} <b>${W.name}:</b> ${P.type==='q'?'escolha onde a bomba cai':'escolha o alvo'} <button class="btn small" id="sCancel">Cancelar</button>`;}
    else{const p=S.pending,it=ITEMS[p.id];st.innerHTML=`${ic(p.id)} <b>${it.name}:</b> ${PROMPTS[p.id][p.step]} <button class="btn small" id="sCancel">Cancelar</button>`;}
    return;
  }
  const who=COLOR_NAME[S.turn]+(isBot(S.turn)?' (bot pensando…)':'');
  let html=kc?`${ic('warn')} <b>XEQUE!</b> Proteja o Rei das ${COLOR_NAME[S.turn]}!`:`Vez das <b>${who}</b>`;
  if(kc)st.classList.add('alert');
  if(S.extra)html+=` — ${ic('double')} <b>ação extra</b>`;
  if(S.sel&&isHumanTurn()){
    const P=S.board[S.sel.r][S.sel.c];
    if(P&&P.color===S.turn){const W=WEAPONS[P.type];
      if(frozen(P))html+=` <span class="wbar">${ic('freeze')} <span class="cd">congelada</span></span>`;
      else if(weaponReady(P))html+=` <span class="wbar">${ic(W.icon)} ${W.name} <button class="btn small danger" id="sAtk" title="${W.desc} (tecla A)">Atacar</button></span>`;
      else html+=` <span class="wbar">${ic(W.icon)} ${W.name} <span class="cd">recarga: ${cdLeft(P)} turno(s)</span></span>`;}
  }
  const noMoves=isHumanTurn()&&!allMoves(S.board,S.turn,S.ep).length;
  if(noMoves)html+=' <button class="btn small" id="sPass">Passar a vez</button>';
  st.innerHTML=html;
}

function center(r,c){const s=$('#wrap').clientWidth/8;return[(c+.5)*s,(r+.5)*s,s];}
function fxAdd(el,ms){$('#fx').appendChild(el);setTimeout(()=>el.remove(),ms);}
function fxText(r,c,t,color){const[x,y]=center(r,c);const d=document.createElement('div');d.className='float';d.textContent=t;d.style.left=x+'px';d.style.top=y+'px';if(color)d.style.color=color;fxAdd(d,1300);}
function fxBurst(r,c,color,n=8){const[x,y,s]=center(r,c);for(let i=0;i<n;i++){const d=document.createElement('div');d.className='part';d.style.background=color;d.style.color=color;const a=Math.random()*Math.PI*2,dist=s*(.5+Math.random()*.9);d.style.left=x+'px';d.style.top=y+'px';d.style.setProperty('--dx',Math.cos(a)*dist+'px');d.style.setProperty('--dy',Math.sin(a)*dist+'px');fxAdd(d,760);}}
function fxIcon(r,c,name){const[x,y,s]=center(r,c);const d=document.createElement('div');d.className='ficon';d.innerHTML=ic(name,'');d.style.left=x+'px';d.style.top=y+'px';d.style.width=d.style.height=s*.7+'px';fxAdd(d,820);}
function fxProjectile(r1,c1,r2,c2,name){const[x1,y1,s]=center(r1,c1),[x2,y2]=center(r2,c2);const d=document.createElement('div');d.className='proj';d.innerHTML=ic(name,'');d.style.width=d.style.height=s*.5+'px';d.style.left=x1+'px';d.style.top=y1+'px';
  const ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI;if(name!=='bomb')d.firstChild.style.transform=`rotate(${ang+45}deg)`;fxAdd(d,320);requestAnimationFrame(()=>requestAnimationFrame(()=>{d.style.left=x2+'px';d.style.top=y2+'px';}));}
function fxBoom(r,c){const[x,y,s]=center(r,c);const d=document.createElement('div');d.className='boom';d.style.left=x+'px';d.style.top=y+'px';d.style.width=d.style.height=s*3.4+'px';fxAdd(d,560);fxBurst(r,c,'#ff9800',12);fxBurst(r,c,'#ffeb3b',6);}
function fxWave(r,c){const[x,y,s]=center(r,c);const d=document.createElement('div');d.className='wave';d.style.left=x+'px';d.style.top=y+'px';d.style.width=d.style.height=s*3.2+'px';fxAdd(d,620);}
function fxBeam(r1,c1,r2,c2,bg){const[x1,y1]=center(r1,c1),[x2,y2]=center(r2,c2);const d=document.createElement('div');d.className='beam';d.style.left=x1+'px';d.style.top=(y1-3)+'px';d.style.width=Math.hypot(x2-x1,y2-y1)+'px';d.style.transform=`rotate(${Math.atan2(y2-y1,x2-x1)}rad)`;d.style.background=bg;d.style.boxShadow='0 0 12px #fff59d';fxAdd(d,560);}
function shake(){const w=$('#wrap');w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');}
function addLog(t){S.logs.unshift(t);S.logs.length=Math.min(S.logs.length,40);$('#log').innerHTML=S.logs.map(x=>`<div>${x}</div>`).join('');}
let toastTimer=null;
function toast(t){const st=$('#status');st.innerHTML=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>S&&render(),1700);}

/* ---------- Modais ---------- */
function openModal(html){$('#modal').innerHTML=html;$('#modalBg').classList.add('open');}
function closeModal(){$('#modalBg').classList.remove('open');}
let nm={mode:'bot',meteors:true};
function weaponCards(){return Object.entries(WEAPONS).map(([t,W])=>`<div class="wcard"><div class="pcs">${miniHTML(t,'w')}<span class="wi">${ic(W.icon,'')}</span></div><div><b>${NAMES[t]}: ${W.name}</b><span>${W.desc} Recarga: ${W.cd} turnos.</span></div></div>`).join('');}
function showNewGame(){
  const md=(id,t,d)=>`<button class="mode ${nm.mode===id?'on':''}" data-mode="${id}"><b>${t}</b><span>${d}</span></button>`;
  openModal(`<h2>${miniHTML('n','w')} Novo jogo</h2><p class="hint">Xadrez onde <b>cada peça tem uma arma</b>. Vence quem capturar o Rei inimigo.</p>
    <div class="modes">${md('bot','Contra o bot','Você joga de Brancas contra a máquina.')}${md('2p','2 jogadores','Revezem no mesmo aparelho.')}${md('demo','Bot vs bot','Assista o caos acontecer.')}</div>
    <label class="tog"><input type="checkbox" id="nmMet" ${nm.meteors?'checked':''}> Chuva de meteoros (a cada 10 jogadas)</label>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">${S?'<button class="btn" data-close="1">Cancelar</button>':''}<button class="btn primary" id="nmGo">Começar!</button></div>`);
}
function showShop(){
  if(!S||S.over||!isHumanTurn())return;const col=S.turn,full=S.inv[col].length>=5;
  const cards=Object.entries(ITEMS).filter(([id])=>id!=='coins').map(([id,it])=>`<div class="card"><div class="ic2">${ic(id,'')}</div><div class="nm">${it.name}</div><div class="ds">${it.desc}${it.free?' <b>Não gasta a ação.</b>':''}</div>
    <button class="btn small ${S.coins[col]>=it.price&&!full?'primary':''}" data-buy="${id}" ${S.coins[col]<it.price||full?'disabled':''}>${ic('coin')} ${it.price}</button></div>`).join('');
  openModal(`<div class="mhead"><h2>${ic('cart')} Loja — ${COLOR_NAME[col]}</h2><button class="btn small" data-close="1">Fechar</button></div>
    <p class="hint">Você tem <b>${ic('coin')} ${S.coins[col]}</b>. Comprar não gasta seu turno. ${full?'<b>Mochila cheia (5 itens).</b>':''} Ganhe moedas capturando peças (+valor da peça) e a cada turno (+1).</p><div class="grid-cards">${cards}</div>`);
}
function showSkins(){
  const sc=Object.entries(SETS).map(([id,s])=>{const own=profile.sets.includes(id),on=profile.set===id;
    return `<div class="card ${on?'sel':''}"><div class="prev">${[['k','w'],['q','w'],['n','b'],['r','b']].map(([t,c])=>miniHTML(t,c,id)).join('')}</div><div class="nm">${s.name}</div>
    <button class="btn small ${!on?'primary':''}" data-skin="set:${id}" ${on||(!own&&profile.gems<s.price)?'disabled':''}>${on?'Em uso':own?'Usar':ic('gem')+' '+s.price}</button></div>`;}).join('');
  const bc=Object.entries(BOARDS).map(([id,b])=>{const own=profile.boards.includes(id),on=profile.board===id;
    return `<div class="card ${on?'sel':''}"><div class="bprev">${[0,1,2,3].map(i=>`<div style="background:${i%2?b.d:b.l}"></div>`).join('')}</div><div class="nm">${b.name}</div>
    <button class="btn small ${!on?'primary':''}" data-skin="board:${id}" ${on||(!own&&profile.gems<b.price)?'disabled':''}>${on?'Em uso':own?'Usar':ic('gem')+' '+b.price}</button></div>`;}).join('');
  openModal(`<div class="mhead"><h2>${ic('palette')} Skins</h2><button class="btn small" data-close="1">Fechar</button></div>
    <p class="hint">Você tem <b>${ic('gem')} ${profile.gems}</b>. Ganhe gemas terminando partidas (vencer o bot dá mais!).</p>
    <h3>Peças</h3><div class="grid-cards">${sc}</div><h3>Tabuleiros</h3><div class="grid-cards">${bc}</div>`);
}
function useSkin(spec){
  const[kind,id]=spec.split(':');const list=kind==='set'?'sets':'boards',cat=kind==='set'?SETS:BOARDS;
  if(!profile[list].includes(id)){if(profile.gems<cat[id].price)return;profile.gems-=cat[id].price;profile[list].push(id);SFX.coin();}
  profile[kind==='set'?'set':'board']=id;saveProfile();if(S)render();showSkins();
}
function showHelp(){
  openModal(`<div class="mhead"><h2>${ic('help')} Como jogar</h2><button class="btn small" data-close="1">Fechar</button></div>
  <ul class="rules">
   <li>As peças se movem como no xadrez (roque, en passant e promoção). <b>Vence quem capturar o Rei</b> — não existe xeque-mate, então fique de olho no aviso de <b>XEQUE</b>.</li>
   <li><b>Cada peça tem uma arma.</b> No seu turno você pode <b>mover</b> ou <b>atacar</b>: selecione a peça e clique em <b>Atacar</b> (ou tecle A). Depois a arma precisa recarregar. Peças com arma pronta mostram um <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff9100;border:2px solid #fff3e0"></span> laranja.</li>
   <li>As armas começam carregando: ficam prontas a partir do seu 3º turno.</li>
   <li>Reis são imunes às armas (até a morte súbita). Escudos absorvem um golpe.</li>
   <li><b>Power-ups</b> aparecem no meio do tabuleiro a cada 3 jogadas: passe por cima para pegar. Mochila de até 5 itens, <b>1 item por turno</b>.</li>
   <li><b>Moedas:</b> +1 por turno e +valor da peça abatida (peão 1, cavalo/bispo 3, torre 5, dama 9). Gaste na loja.</li>
   <li>Peça que abate 2 inimigos vira <b>Veterana</b>: escudo grátis e arma recarregada.</li>
   <li><b>Meteoros:</b> casas marcadas em vermelho serão atingidas em 2 jogadas.</li>
   <li><b>Morte súbita:</b> após 120 jogadas, Reis perdem a imunidade e caem mais meteoros.</li>
   <li><b>Gemas</b> ganhas no fim das partidas desbloqueiam skins de peças e tabuleiros.</li>
  </ul>
  <h3>Arsenal</h3><div class="wtable">${weaponCards()}</div>
  <h3>Power-ups</h3><div class="grid-cards">${Object.entries(ITEMS).filter(([id])=>id!=='coins').map(([id,i])=>`<div class="card"><div class="nm">${ic(id)} ${i.name}</div><div class="ds">${i.desc}</div></div>`).join('')}</div>`);
}
function showGameOver(win,why,gems){
  const youWin=S.mode==='bot'?(win==='w'?'Você venceu!':'O bot venceu…'):`${COLOR_NAME[win]} venceram!`;
  openModal(`<div class="big">${ic(S.mode==='bot'&&win==='b'?'skull':'trophy','')}</div><h2 style="justify-content:center">${youWin}</h2><p style="text-align:center" class="hint">${why}</p>
   ${gems?`<p style="text-align:center;font-size:1.2rem">+${gems} ${ic('gem')} gemas</p>`:''}
   <div style="display:flex;gap:8px;justify-content:center;margin-top:12px"><button class="btn" id="goSkins">${ic('palette')} Skins</button><button class="btn primary" id="goNew">Jogar de novo</button></div>`);
}

/* ---------- Eventos ---------- */
$('#board').addEventListener('click',e=>{
  const sq=e.target.closest('.sq');if(!sq||!S||S.over||!isHumanTurn())return;
  ac();
  const r=+sq.dataset.r,c=+sq.dataset.c;
  if(S.pending){handlePendingClick(r,c);return;}
  const P=S.board[r][c];
  if(S.sel){const m=S.moves.find(m=>m.tr===r&&m.tc===c);if(m){S.sel=null;S.moves=[];doMove(m);return;}}
  if(P&&P.color===S.turn){
    if(S.sel&&S.sel.r===r&&S.sel.c===c){S.sel=null;S.moves=[];}
    else{S.sel={r,c};S.moves=pseudoMoves(S.board,r,c,S.ep);if(frozen(P)){render();toast(`${ic('freeze')} Essa peça está congelada!`);SFX.freeze();return;}}
  }else{S.sel=null;S.moves=[];}
  render();
});
$('#board').addEventListener('mouseover',e=>{
  if(!S||!S.pending||S.pending.kind!=='weapon')return;const sq=e.target.closest('.sq');if(!sq)return;
  const r=+sq.dataset.r,c=+sq.dataset.c;if(hoverSq&&hoverSq[0]===r&&hoverSq[1]===c)return;
  hoverSq=[r,c];if(S.board[S.pending.r][S.pending.c]?.type==='q')render();
});
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.item!==undefined){ac();startItem(+t.dataset.item);}
  else if(t.dataset.shop){showShop();}
  else if(t.dataset.buy){buyItem(t.dataset.buy);}
  else if(t.dataset.skin){useSkin(t.dataset.skin);}
  else if(t.dataset.close){closeModal();}
  else if(t.dataset.mode){nm.mode=t.dataset.mode;nm.meteors=$('#nmMet').checked;showNewGame();}
  else if(t.id==='nmGo'){nm.meteors=$('#nmMet').checked;closeModal();ac();newGame(nm.mode,nm.meteors);}
  else if(t.id==='sCancel'){cancelPending();}
  else if(t.id==='sAtk'){ac();startWeapon();}
  else if(t.id==='sPass'){addLog(`${COLOR_NAME[S.turn]} passaram a vez.`);endTurn();}
  else if(t.id==='sNew'||t.id==='goNew'){showNewGame();}
  else if(t.id==='goSkins'){showSkins();}
});
$('#bNew').onclick=showNewGame;
$('#bSkins').onclick=showSkins;
$('#bHelp').onclick=showHelp;
$('#bMute').onclick=()=>{profile.muted=!profile.muted;saveProfile();$('#bMute').innerHTML=ic(profile.muted?'mute':'sound');};
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg'&&S)closeModal();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modalBg').classList.contains('open')&&S)closeModal();else cancelPending();}
  else if((e.key==='a'||e.key==='A')&&!$('#modalBg').classList.contains('open'))startWeapon();
});

buildDefs();
$('#logo').innerHTML=miniHTML('n','w','classic');
$('#bSkins').innerHTML=ic('palette')+' Skins';
$('#bHelp').innerHTML=ic('help')+' Regras';
newGame('bot',true);
showNewGame();
window.__xc={get S(){return S},newGame,render:()=>render(),useWeapon,weaponTargets};
</script>
</body>
</html>
